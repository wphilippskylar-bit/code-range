  X.add('sql1', { gateN: 16,
    lesson: [{ h: 'Deep dive: filtering precisely (and the NULL trap)', html: '<pre>SELECT DISTINCT product            -- unique values only\nFROM orders\nWHERE ordered BETWEEN \'2025-03-03\' AND \'2025-03-10\'   -- inclusive both ends\n  AND product IN (\'Mouse\', \'Monitor\')                  -- list membership\n  AND product LIKE \'M%\'                               -- % = any chars, _ = one char\nORDER BY product\nLIMIT 10 OFFSET 0;                 -- paging</pre><ul><li><b>NULL means unknown</b>. <code>salary = NULL</code> is never true (it evaluates to NULL). Use <code>IS NULL</code> / <code>IS NOT NULL</code>.</li><li><b>Precedence</b>: <code>AND</code> binds tighter than <code>OR</code>. <code>a OR b AND c</code> means <code>a OR (b AND c)</code>. Always add parentheses when mixing them.</li><li>Text in single quotes; identifiers (column names) in double quotes only if needed.</li><li><code>COALESCE(x, 0)</code> replaces NULL with a default; <code>NULLIF(a, b)</code> returns NULL when they are equal (handy to avoid divide-by-zero).</li><li>Logical order of execution: <b>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</b>. That is why a SELECT alias cannot be used in WHERE (in standard SQL).</li></ul>' }],
    qs: [
      Q('WHERE salary = NULL returns:', 'No rows — comparisons with NULL are never true; use IS NULL', ['All rows with a NULL salary', 'An error', 'All rows'], 'NULL is unknown, not a value.', 0),
      Q('WHERE dept = \'Eng\' OR dept = \'Sales\' AND salary > 100000 is evaluated as:', 'dept = \'Eng\' OR (dept = \'Sales\' AND salary > 100000)', ['(dept = \'Eng\' OR dept = \'Sales\') AND salary > 100000', 'Left to right with no precedence', 'An error'], 'AND binds tighter than OR.', 0),
      Q('BETWEEN 10 AND 20 includes:', '10 and 20 (both ends inclusive)', ['Neither end', 'Only 10', 'Only 20'], 'Inclusive range.', 0),
      Q('LIKE \'_at\' matches:', '"cat" and "hat" but not "flat"', ['"flat" only', 'Anything containing "at"', 'Only "_at"'], '_ is exactly one character.', 0),
      Q('In SQL\'s logical order, which runs first?', 'FROM / WHERE', ['SELECT', 'ORDER BY', 'LIMIT'], 'Rows are filtered before columns are chosen.', 0),
      Q('SELECT COUNT(salary) FROM employees counts:', 'Only rows where salary is not NULL', ['All rows', 'Distinct salaries', 'NULL rows only'], 'COUNT(col) skips NULLs; COUNT(*) does not.', 0),
      Q('Show page 3 of results with 20 rows per page:', 'LIMIT 20 OFFSET 40', ['LIMIT 3 OFFSET 20', 'LIMIT 60', 'OFFSET 3'], 'Skip 2 pages × 20.', 0),
      Q('COALESCE(discount, 0) returns:', 'discount, or 0 when discount is NULL', ['Always 0', 'NULL when discount is 0', 'The sum of discount and 0'], 'First non-NULL argument.', 0),
      Q('Against the course database, SELECT COUNT(DISTINCT product) FROM orders returns:', '4', ['9', '5', '3'], 'Keyboard, Mouse, Monitor, Cable.', 0),
      T('Type the operator used to test for a missing value (two words).', [/^is\s+null$/i], 'IS NULL', 0, 'IS ...')
    ],
    labs: ['sqx-between', 'sqx-fix-null'] });

  slab('sqx-between', { title: 'Distinct products in a date range', brief: 'Return the <b>distinct product names</b> (column <b>product</b>) ordered between <b>2025-03-03</b> and <b>2025-03-10</b> inclusive, alphabetically.',
    solution: "SELECT DISTINCT product FROM orders WHERE ordered BETWEEN '2025-03-03' AND '2025-03-10' ORDER BY product;",
    mustUse: ['DISTINCT', 'BETWEEN'],
    hints: ['ISO dates (YYYY-MM-DD) compare correctly as text.', "WHERE ordered BETWEEN '2025-03-03' AND '2025-03-10'", 'SELECT DISTINCT product … ORDER BY product.'],
    debrief: 'DISTINCT + BETWEEN on ISO dates — a filter you will write constantly for reports.' });
  slab('sqx-fix-null', { title: 'Fix it: the HR filter', brief: 'HR wants the <b>name</b> of every employee who is in <b>Eng or Sales</b> <i>and</i> earns <b>at least 120000</b>, plus every employee whose salary is <b>missing</b> so they can fix the record. Sort by name. The query below returns the wrong people — fix it.',
    starter: "SELECT name\nFROM employees\nWHERE dept = 'Eng' OR dept = 'Sales' AND salary >= 120000\n   OR salary = NULL\nORDER BY name;",
    solution: "SELECT name FROM employees WHERE ((dept = 'Eng' OR dept = 'Sales') AND salary >= 120000) OR salary IS NULL ORDER BY name;",
    mustUse: ['IS\\s+NULL'],
    hints: ['Run it: Jon (95000) shows up and Nia (NULL salary) does not.', 'AND binds tighter than OR — group the department test in parentheses.', '<code>salary = NULL</code> is never true; use <code>salary IS NULL</code>.'],
    debrief: 'Precedence and NULL comparisons are the two most common WHERE-clause bugs, and they fail silently — no error, just wrong rows.' });

  // ---------------- sql2 ----------------
  X.add('sql2', { gateN: 16,
    lesson: [{ h: 'Deep dive: join types and the fan-out trap', html: '<table><tr><th>Join</th><th>Keeps</th></tr><tr><td>INNER JOIN</td><td>Only rows that match on both sides</td></tr><tr><td>LEFT JOIN</td><td>Every row from the left table; NULLs where the right has no match</td></tr><tr><td>RIGHT / FULL OUTER</td><td>Every row from the right / from both (SQLite 3.39+ supports both)</td></tr><tr><td>CROSS JOIN</td><td>Every combination (rows × rows)</td></tr></table><pre>-- customers with their order counts, INCLUDING customers with no orders\nSELECT c.name, COUNT(o.id) AS orders     -- COUNT(o.id), not COUNT(*)\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name;\n\n-- "anti-join": customers with NO orders\nSELECT c.name FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;</pre><ul><li><b>Fan-out</b>: joining a one-to-many relationship repeats the "one" side. <code>COUNT(*)</code> then counts orders, not customers, and summing a customer-level column double-counts. Use <code>COUNT(DISTINCT c.id)</code> or aggregate before joining.</li><li>With LEFT JOIN, a filter on the right table in <code>WHERE</code> silently turns it into an inner join. Put it in the <code>ON</code> clause instead: <code>LEFT JOIN orders o ON o.customer_id = c.id AND o.product = \'Mouse\'</code>.</li><li>Every non-aggregated column in SELECT should be in GROUP BY.</li></ul>' }],
    qs: [
      Q('Which join lists every customer, even those with zero orders?', 'customers LEFT JOIN orders', ['customers INNER JOIN orders', 'orders LEFT JOIN customers', 'CROSS JOIN'], 'LEFT keeps every left row.', 0),
      Q('After customers LEFT JOIN orders, COUNT(*) for a customer with no orders is:', '1 — the NULL-padded row is still a row; COUNT(o.id) gives 0', ['0', 'NULL', 'An error'], 'Count a column from the right table.', 0),
      Q('WHERE o.product = \'Mouse\' after a LEFT JOIN to orders:', 'Removes customers without a Mouse order, turning it into an inner join', ['Keeps all customers', 'Is a syntax error', 'Only affects ORDER BY'], 'Move right-table filters to ON.', 0),
      Q('Find customers who have never ordered:', 'LEFT JOIN orders and keep rows WHERE o.id IS NULL (or NOT EXISTS)', ['INNER JOIN and WHERE o.id = 0', 'GROUP BY with COUNT(*) = 0', 'CROSS JOIN'], 'The anti-join pattern.', 0),
      Q('A 5-row table CROSS JOIN another 5-row table returns:', '25 rows', ['5 rows', '10 rows', '0 rows'], 'Every combination.', 0),
      Q('Fan-out happens when:', 'A one-to-many join repeats the "one" row for each match, inflating counts and sums', ['A join has no matches', 'You use DISTINCT', 'Tables have no primary key'], 'Aggregate before joining or count DISTINCT.', 0),
      Q('In this course database, customers LEFT JOIN orders produces how many rows?', '10 (9 matched orders + 1 for Fay, who has none)', ['9', '6', '15'], 'Fay gets one NULL-padded row.', 0),
      Q('HAVING vs WHERE:', 'WHERE filters rows before grouping; HAVING filters groups after aggregation', ['They are identical', 'HAVING runs first', 'WHERE can use SUM()'], 'Aggregates belong in HAVING.', 0),
      Q('A self-join is used to:', 'Relate rows in the same table, e.g. employee to manager', ['Copy a table', 'Delete duplicates automatically', 'Join a table to a view only'], 'Alias the table twice.', 0)
    ],
    labs: ['sqx-leftjoin', 'sqx-fix-fanout'] });

  slab('sqx-leftjoin', { title: 'Every customer, with order counts', brief: 'Return every customer\'s <b>name</b> and their number of orders as <b>order_count</b> — <b>including customers with no orders</b> (count 0). Sort by order_count descending, then name.',
    solution: "SELECT c.name, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id, c.name ORDER BY order_count DESC, c.name;",
    mustUse: ['LEFT\\s+(OUTER\\s+)?JOIN'],
    hints: ['Start FROM customers c and LEFT JOIN orders o ON o.customer_id = c.id.', '<code>COUNT(o.id)</code> counts only real orders, so Fay gets 0.', 'GROUP BY c.id, c.name, then ORDER BY order_count DESC, c.name.'],
    debrief: 'LEFT JOIN + COUNT(right_column) is how you avoid silently dropping the zeros — often the most important rows in a report.' });
  slab('sqx-fix-fanout', { title: 'Fix it: the city revenue report', brief: 'For <b>every city</b> (including cities whose customers never ordered), return <b>city</b>, the number of <b>customers</b> living there, and <b>revenue</b> (sum of qty×price, rounded to 2 decimals, <b>0</b> when none). Sort by revenue descending, then city. The query has <b>three bugs</b>.',
    starter: "SELECT c.city,\n       COUNT(*) AS customers,\n       SUM(o.qty * o.price) AS revenue\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.city\nORDER BY revenue DESC;",
    solution: "SELECT c.city, COUNT(DISTINCT c.id) AS customers, ROUND(COALESCE(SUM(o.qty * o.price), 0), 2) AS revenue FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.city ORDER BY revenue DESC, c.city;",
    hints: ['Norman shows 5 "customers" — that is the number of orders. Count <code>DISTINCT c.id</code>.', 'Moore is missing: use LEFT JOIN.', 'Moore\'s revenue would be NULL: wrap in <code>COALESCE(…, 0)</code> and ROUND to 2. Add city as a tie-breaker.'],
    debrief: 'Fan-out inflated the customer count, an inner join dropped a city, and NULL leaked into a number column. Reviewers catch these by sanity-checking counts against the source tables.' });

  // ---------------- sql3 ----------------
  X.add('sql3', { gateN: 14,
    lesson: [{ h: 'Deep dive: subqueries, EXISTS and the NOT IN trap', html: '<pre>-- scalar subquery: compare to a single computed value\nSELECT name, salary FROM employees\nWHERE salary &gt; (SELECT AVG(salary) FROM employees);\n\n-- correlated subquery: runs per outer row\nSELECT e.name FROM employees e\nWHERE e.salary &gt; (SELECT AVG(salary) FROM employees WHERE dept = e.dept);\n\n-- EXISTS: is there at least one matching row?\nSELECT p.name FROM products p\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.product = p.name);\n\n-- chained CTEs read like steps\nWITH spend AS (SELECT customer_id, SUM(qty*price) AS total FROM orders GROUP BY customer_id),\n     avg_spend AS (SELECT AVG(total) AS a FROM spend)\nSELECT * FROM spend, avg_spend WHERE total &gt; a;</pre><ul><li><b>NOT IN with NULLs</b>: <code>x NOT IN (1, 2, NULL)</code> is never true, because x &lt;&gt; NULL is unknown. If the subquery can return NULL, use <code>NOT EXISTS</code>.</li><li><code>AVG</code> ignores NULLs; <code>AVG(COALESCE(x, 0))</code> treats them as zero — choose deliberately.</li><li>Recursive CTEs (<code>WITH RECURSIVE</code>) walk hierarchies such as org charts and category trees.</li><li>Integer division: in SQLite <code>5 / 2 = 2</code>. Multiply by <code>1.0</code> (or <code>100.0</code>) for decimals.</li></ul>' }],
    qs: [
      Q('id NOT IN (SELECT manager_id FROM employees) returns no rows at all. Why?', 'manager_id contains NULL, so every NOT IN comparison is unknown', ['NOT IN is not supported', 'The subquery is empty', 'IDs are integers'], 'Use NOT EXISTS or filter out NULLs.', 0),
      Q('A correlated subquery is one that:', 'References a column from the outer query, so it is evaluated per outer row', ['Has no WHERE clause', 'Is written in a CTE', 'Returns many columns'], 'e.dept inside the subquery.', 0),
      Q('SELECT 5 / 2 in SQLite returns:', '2', ['2.5', '3', 'An error'], 'Integer division. Use 5 * 1.0 / 2.', 0),
      Q('In this database, SELECT AVG(salary) FROM employees averages over how many rows?', '7 — AVG skips Nia\'s NULL salary', ['8', '6', '0'], 'Aggregates ignore NULL.', 0),
      Q('EXISTS (subquery) is true when:', 'The subquery returns at least one row', ['The subquery returns exactly one row', 'Every row matches', 'The subquery returns NULL'], 'It only checks for existence.', 0),
      Q('Walk an employee → manager → manager\'s manager chain of unknown depth:', 'WITH RECURSIVE', ['GROUP BY', 'A scalar subquery', 'CROSS JOIN'], 'Recursive CTEs walk trees.', 0),
      Q('Why use a CTE instead of a nested subquery?', 'It names each step so complex queries read top to bottom and can be reused', ['It is always faster', 'Subqueries are deprecated', 'CTEs store data permanently'], 'Readability.', 0),
      Q('Which product in this database has never been ordered?', 'Webcam', ['Cable', 'Mouse', 'Monitor'], 'It is in products but not orders.', 0)
    ],
    labs: ['sqx-above-avg', 'sqx-not-exists'] });

  slab('sqx-above-avg', { title: 'Customers above average spend', brief: 'Return the <b>name</b> and <b>total</b> spend (sum of qty×price, rounded to 2) of customers whose total is <b>above the average total</b> of customers who ordered. Highest first. Use a CTE.',
    starter: 'WITH spend AS (\n  -- total per customer\n)\nSELECT ...',
    solution: "WITH spend AS (SELECT customer_id, SUM(qty*price) AS total FROM orders GROUP BY customer_id) SELECT c.name, ROUND(s.total, 2) AS total FROM spend s JOIN customers c ON c.id = s.customer_id WHERE s.total > (SELECT AVG(total) FROM spend) ORDER BY s.total DESC;",
    mustUse: ['WITH'],
    hints: ['CTE: per-customer totals with GROUP BY customer_id.', 'Average of those totals: <code>(SELECT AVG(total) FROM spend)</code>.', 'Join spend to customers for names; filter, round, sort DESC.'],
    debrief: 'Comparing each row to an aggregate of the set — "above average", "top 10%" — is a core analyst move.' });
  slab('sqx-not-exists', { title: 'What Tulsa never bought', brief: 'Return the <b>name</b> and <b>category</b> of products that <b>no customer from Tulsa</b> has ever ordered. Sort by name. Use <code>NOT EXISTS</code>.',
    solution: "SELECT p.name, p.category FROM products p WHERE NOT EXISTS (SELECT 1 FROM orders o JOIN customers c ON c.id = o.customer_id WHERE c.city = 'Tulsa' AND o.product = p.name) ORDER BY p.name;",
    mustUse: ['NOT\\s+EXISTS'],
    hints: ['Outer query: FROM products p.', "Inner: SELECT 1 FROM orders o JOIN customers c ON c.id = o.customer_id WHERE c.city = 'Tulsa' AND o.product = p.name", 'The inner query is correlated through <code>p.name</code>.'],
    debrief: 'NOT EXISTS is the safe anti-join: correct with NULLs and usually well-optimized.' });

  // ---------------- sql4 ----------------
  X.add('sql4', { gateN: 14,
    lesson: [{ h: 'Deep dive: top-N per group, shares of total, and frames', html: '<pre>-- top 1 per group: rank inside a CTE, then filter (you cannot filter a window in WHERE)\nWITH ranked AS (\n  SELECT customer_id, product, qty*price AS line,\n         ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY qty*price DESC, id) AS rn\n  FROM orders)\nSELECT * FROM ranked WHERE rn = 1;\n\n-- share of total: a window over the whole result\nSELECT product, SUM(qty*price) AS rev,\n       ROUND(100.0 * SUM(qty*price) / SUM(SUM(qty*price)) OVER (), 1) AS pct\nFROM orders GROUP BY product;\n\n-- frames\nAVG(x) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)  -- 7-day moving average\nFIRST_VALUE(x) OVER (PARTITION BY g ORDER BY d)                    -- first in group</pre><ul><li>Window functions run <b>after</b> WHERE/GROUP BY/HAVING, so to filter on them, wrap in a CTE or subquery.</li><li><code>OVER ()</code> with nothing inside = the whole result set.</li><li>Ties: ROW_NUMBER picks one arbitrarily unless you add a tie-breaker to ORDER BY; use RANK if ties should all be kept.</li><li>With <code>ORDER BY</code> in the window, the default frame is "start to current row" (RANGE) — which is why SUM becomes a running total and why <code>LAST_VALUE</code> surprises people.</li></ul>' }],
    qs: [
      Q('Why can\'t you write WHERE ROW_NUMBER() OVER (...) = 1?', 'Window functions are computed after WHERE; filter in an outer query or CTE', ['ROW_NUMBER needs GROUP BY', 'It works fine', 'WHERE cannot use numbers'], 'Wrap, then filter.', 0),
      Q('SUM(x) OVER () gives:', 'The grand total on every row', ['A running total', 'An error', 'NULL'], 'Empty window = all rows.', 0),
      Q('To keep all tied customers in a "top spender" query, use:', 'RANK() and keep rank = 1', ['ROW_NUMBER() = 1', 'LIMIT 1', 'MAX() with GROUP BY only'], 'RANK keeps ties.', 0),
      Q('ROWS BETWEEN 6 PRECEDING AND CURRENT ROW over daily rows gives:', 'A 7-day moving window', ['A 6-day window', 'The whole table', 'Only the current row'], '6 previous + current.', 0),
      Q('LAST_VALUE(x) OVER (ORDER BY d) often returns the current row\'s x because:', 'The default frame ends at the current row', ['LAST_VALUE is broken', 'ORDER BY is ignored', 'It needs PARTITION BY'], 'Specify ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING.', 0),
      Q('Percent of total for each product needs:', 'Product revenue divided by SUM(revenue) OVER (), times 100.0', ['GROUP BY total', 'A CROSS JOIN only', 'COUNT(*)'], 'Window over an aggregate.', 0),
      Q('In this database, which product has the largest revenue?', 'Monitor', ['Keyboard', 'Cable', 'Mouse'], '3 × 199 = 597.', 0)
    ],
    labs: ['sqx-top-per-group', 'sqx-share'] });

  slab('sqx-top-per-group', { title: 'Each customer\'s biggest order line', brief: 'For each customer who ordered, return <b>name</b>, the <b>product</b> of their largest order line (qty×price) and that <b>line_total</b> (rounded to 2). Break ties by the earlier order id. Sort by name.',
    solution: "WITH ranked AS (SELECT customer_id, product, qty*price AS line_total, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY qty*price DESC, id) AS rn FROM orders) SELECT c.name, r.product, ROUND(r.line_total, 2) AS line_total FROM ranked r JOIN customers c ON c.id = r.customer_id WHERE r.rn = 1 ORDER BY c.name;",
    mustUse: ['PARTITION\\s+BY'],
    hints: ['In a CTE, number each customer\'s lines: <code>ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY qty*price DESC, id) AS rn</code>.', 'Outer query: keep <code>rn = 1</code>.', 'Join to customers for the name; round line_total.'],
    debrief: 'Top-N per group is the most-asked analytics interview question — and a daily task in real reporting.' });
  slab('sqx-share', { title: 'Revenue share by product', brief: 'Return each <b>product</b>, its <b>revenue</b> (sum of qty×price, rounded to 2) and <b>pct</b>: its share of all revenue as a percentage rounded to 1 decimal. Highest revenue first.',
    solution: "SELECT product, ROUND(SUM(qty*price), 2) AS revenue, ROUND(100.0 * SUM(qty*price) / SUM(SUM(qty*price)) OVER (), 1) AS pct FROM orders GROUP BY product ORDER BY revenue DESC;",
    mustUse: ['OVER\\s*\\(\\s*\\)'],
    hints: ['GROUP BY product with SUM(qty*price).', 'The grand total of those sums is <code>SUM(SUM(qty*price)) OVER ()</code>.', 'Multiply by <code>100.0</code> to avoid integer division, then ROUND(…, 1).'],
    debrief: 'Mixing GROUP BY with a window over the grouped result gives shares, ratios and contribution analysis in one query.' });

  // ---------------- sql5 ----------------
  X.add('sql5', { gateN: 14,
    lesson: [{ h: 'Deep dive: reading query plans and modeling decisions', html: '<pre>EXPLAIN QUERY PLAN\nSELECT * FROM orders WHERE customer_id = 3;\n--  SCAN orders                       ← reads every row\n\nCREATE INDEX idx_orders_customer ON orders(customer_id);\n--  SEARCH orders USING INDEX idx_orders_customer (customer_id=?)   ← jumps straight there</pre><ul><li>An index helps <b>selective</b> filters, joins and ORDER BY. A <b>composite</b> index <code>(customer_id, ordered)</code> serves filters on customer_id, or on both — not on ordered alone (leftmost-prefix rule).</li><li>Index killers: wrapping the column in a function (<code>WHERE lower(email) = …</code>), leading wildcards (<code>LIKE \'%son\'</code>), implicit type conversions.</li><li><b>Normalization</b>: 1NF (atomic values, no repeating groups), 2NF (no partial dependency on a composite key), 3NF (no column depends on another non-key column). Denormalize deliberately for read-heavy analytics (star schemas: a fact table + dimension tables).</li><li><b>Keys</b>: primary key (unique row identity), foreign key (references another table\'s key — enable in SQLite with <code>PRAGMA foreign_keys = ON</code>), natural vs surrogate keys.</li><li>Self-joins model hierarchies; conditional aggregation (<code>SUM(CASE WHEN … THEN … ELSE 0 END)</code>) pivots rows into columns.</li></ul>' }],
    qs: [
      Q('EXPLAIN QUERY PLAN shows "SCAN orders" for a filter on customer_id. What does it mean?', 'Every row is read; an index on customer_id would allow a SEARCH', ['The query failed', 'The result is cached', 'An index is already used'], 'SCAN = full table read.', 0),
      Q('A composite index on (customer_id, ordered) helps which filter least?', 'WHERE ordered = \'2025-03-01\' alone', ['WHERE customer_id = 3', 'WHERE customer_id = 3 AND ordered > \'2025-03-01\'', 'ORDER BY customer_id, ordered'], 'Leftmost-prefix rule.', 0),
      Q('Why might WHERE lower(email) = \'a@x.com\' ignore an index on email?', 'Applying a function to the column prevents a plain index lookup (use an expression index or store normalized values)', ['lower() is not valid SQL', 'Emails cannot be indexed', 'It always uses the index'], 'Sargability.', 0),
      Q('A table stores customer_city in every order row. Which normal form issue is this?', 'A transitive dependency (3NF): city depends on the customer, not the order', ['1NF violation', 'Primary key missing', 'No issue'], 'Store it once in customers.', 0),
      Q('A star schema has:', 'A central fact table of events/measures joined to dimension tables', ['One table only', 'No keys', 'Only views'], 'The analytics model.', 0),
      Q('Turn rows per product into a column per product:', 'Conditional aggregation: SUM(CASE WHEN product = \'X\' THEN qty ELSE 0 END)', ['UNION ALL', 'DISTINCT', 'LIMIT'], 'Pivot with CASE.', 0),
      Q('Foreign keys in SQLite are enforced only when:', 'PRAGMA foreign_keys = ON is set for the connection', ['Always', 'Never', 'You use INTEGER keys'], 'Off by default for compatibility.', 0)
    ],
    labs: ['sqx-selfjoin', 'sqx-pivot'] });

  slab('sqx-selfjoin', { title: 'Employees and their managers', brief: 'Return each employee\'s <b>employee</b> name and their <b>manager</b>\'s name. Top-level employees (no manager) show <b>(none)</b>. Sort by employee.',
    solution: "SELECT e.name AS employee, COALESCE(m.name, '(none)') AS manager FROM employees e LEFT JOIN employees m ON m.id = e.manager_id ORDER BY e.name;",
    mustUse: ['JOIN'],
    hints: ['Alias the same table twice: <code>employees e</code> and <code>employees m</code>.', 'LEFT JOIN so Grace and Kim are kept: <code>ON m.id = e.manager_id</code>.', "COALESCE(m.name, '(none)') AS manager."],
    debrief: 'A self-join turns a parent pointer into a readable hierarchy — org charts, category trees, reply threads.' });
  slab('sqx-pivot', { title: 'Pivot quantities by city', brief: 'For each <b>city</b> with orders, return <b>keyboards</b> (total Keyboard quantity), <b>monitors</b> (total Monitor quantity) and <b>total_qty</b> (all products). Sort by city.',
    solution: "SELECT c.city, SUM(CASE WHEN o.product = 'Keyboard' THEN o.qty ELSE 0 END) AS keyboards, SUM(CASE WHEN o.product = 'Monitor' THEN o.qty ELSE 0 END) AS monitors, SUM(o.qty) AS total_qty FROM orders o JOIN customers c ON c.id = o.customer_id GROUP BY c.city ORDER BY c.city;",
    mustUse: ['CASE'],
    hints: ['Join orders to customers and GROUP BY c.city.', "keyboards: <code>SUM(CASE WHEN o.product = 'Keyboard' THEN o.qty ELSE 0 END)</code>", 'Same for Monitor; total_qty is a plain SUM(o.qty).'],
    debrief: 'Conditional aggregation is the portable way to pivot — it works in every SQL database.' });

  // ---------------- new stage: real-world SQL ----------------
  X.insertAfter('sql5', {
    id: 'sql6', track: 'sql', tier: 'sql-exp', title: 'Real-world SQL: schemas, transactions & safe queries', code: 'BEGIN; UPDATE ...; COMMIT;', gateN: 12,
    goal: 'Design tables with constraints, change data safely in transactions, upsert, handle dates and messy data, analyze funnels — and keep queries safe from SQL injection.',
    lesson: [
      { h: 'Define data with constraints', html: '<pre>CREATE TABLE reviews (\n  id       INTEGER PRIMARY KEY,\n  product  TEXT NOT NULL REFERENCES products(name),\n  stars    INTEGER NOT NULL CHECK (stars BETWEEN 1 AND 5),\n  email    TEXT UNIQUE,\n  created  TEXT DEFAULT CURRENT_TIMESTAMP\n);\nALTER TABLE reviews ADD COLUMN helpful INTEGER DEFAULT 0;\nCREATE VIEW top_products AS SELECT product, AVG(stars) AS avg_stars FROM reviews GROUP BY product;</pre><p>Constraints make bad data <b>impossible</b> instead of merely unlikely: <code>NOT NULL</code>, <code>UNIQUE</code>, <code>CHECK</code>, <code>PRIMARY KEY</code>, <code>FOREIGN KEY</code>, <code>DEFAULT</code>. A <b>view</b> is a saved query you can select from.</p>' },
      { h: 'Change data safely', html: '<pre>BEGIN;\nUPDATE accounts SET balance = balance - 50 WHERE id = 1;\nUPDATE accounts SET balance = balance + 50 WHERE id = 2;\nCOMMIT;           -- or ROLLBACK; if anything failed\n\n-- upsert: insert, or update if the key already exists\nINSERT INTO products (name, category, stock) VALUES (\'Mouse\', \'peripherals\', 10)\nON CONFLICT(name) DO UPDATE SET stock = stock + excluded.stock;</pre><ul><li><b>ACID</b>: Atomic (all or nothing), Consistent (constraints hold), Isolated (concurrent transactions don\'t see half-done work), Durable (committed data survives crashes).</li><li>Before any <code>UPDATE</code> or <code>DELETE</code>, run the same <code>WHERE</code> as a <code>SELECT</code> to see what will change. An UPDATE without WHERE changes <b>every row</b>.</li><li><code>excluded.col</code> refers to the value you tried to insert.</li></ul>' },
      { h: 'Dates, text and messy data (SQLite)', html: '<ul><li>Store dates as ISO text (<code>2025-03-01</code>) so they sort and compare correctly.</li><li><code>date(\'2025-03-01\', \'+7 days\')</code>, <code>strftime(\'%Y-%m\', ordered)</code> (group by month), <code>julianday(b) - julianday(a)</code> (days between).</li><li>Clean text: <code>TRIM()</code>, <code>LOWER()</code>, <code>REPLACE()</code>, <code>SUBSTR()</code>, <code>||</code> to concatenate. <code>CAST(x AS INTEGER)</code> converts types.</li><li>Deduplicate: <code>ROW_NUMBER() OVER (PARTITION BY email ORDER BY created DESC)</code> and keep rn = 1.</li><li>Funnels and retention: <code>COUNT(DISTINCT CASE WHEN type = \'signup\' THEN user_id END)</code> counts users who reached a step.</li></ul>' },
      { h: 'Never build SQL from user input', html: '<pre>// UNSAFE — input becomes code\ndb.query("SELECT * FROM users WHERE email = \'" + email + "\'");\n\n// SAFE — a parameterized query; input is always treated as data\ndb.query("SELECT * FROM users WHERE email = ?", [email]);</pre><p><b>SQL injection</b> happens when user input is concatenated into a query string, letting crafted input change the query\'s meaning. The fix is <b>parameterized queries / prepared statements</b> (every database library supports them), plus least-privilege database accounts and input validation as defense in depth. ORMs parameterize for you — until someone uses a raw-string escape hatch, so review those carefully.</p>' }
    ],
    cards: [['NOT NULL / UNIQUE / CHECK', 'Constraints that make invalid data impossible.'], ['FOREIGN KEY', 'A column that must match another table\'s key.'], ['VIEW', 'A saved query you can SELECT from.'], ['BEGIN … COMMIT', 'A transaction: all statements succeed or none do.'], ['ROLLBACK', 'Undo the current transaction.'], ['ACID', 'Atomic, Consistent, Isolated, Durable.'], ['ON CONFLICT … DO UPDATE', 'Upsert: insert or update an existing key.'], ['excluded.col', 'The value you attempted to insert in an upsert.'], ['strftime(\'%Y-%m\', d)', 'Year-month for monthly grouping (SQLite).'], ['julianday(b) - julianday(a)', 'Days between two dates (SQLite).'], ['Parameterized query', 'Placeholders (?) keep user input as data — prevents SQL injection.'], ['Select before you delete', 'Run the WHERE as a SELECT first to preview affected rows.']],
    qs: [
      Q('UPDATE products SET stock = 0; (no WHERE) does what?', 'Sets stock to 0 on every row', ['Updates the first row only', 'Fails with an error', 'Does nothing'], 'Always preview with SELECT … WHERE first.', 0),
      Q('Two UPDATEs move money between accounts. Why wrap them in BEGIN/COMMIT?', 'So both happen or neither does if something fails midway (atomicity)', ['To make them faster', 'To skip constraints', 'Transactions are required for every SELECT'], 'All or nothing.', 0),
      Q('The best defense against SQL injection is:', 'Parameterized queries / prepared statements', ['Escaping quotes by hand', 'Hiding error messages', 'Using POST instead of GET'], 'Input stays data, never code.', 0),
      Q('A CHECK (stars BETWEEN 1 AND 5) constraint:', 'Rejects inserts or updates where stars is outside 1–5', ['Rounds stars into range', 'Only warns', 'Applies only to SELECT'], 'The database enforces it.', 0),
      Q('In INSERT … ON CONFLICT(name) DO UPDATE SET stock = stock + excluded.stock, excluded.stock is:', 'The stock value from the row you tried to insert', ['The old stock', 'Always 0', 'A deleted row'], 'The proposed new values.', 0),
      Q('Group orders by month in SQLite:', 'GROUP BY strftime(\'%Y-%m\', ordered)', ['GROUP BY MONTH(ordered) only', 'GROUP BY ordered / 30', 'ORDER BY month'], 'strftime formats dates.', 0),
      Q('Count users who reached the signup step:', 'COUNT(DISTINCT CASE WHEN type = \'signup\' THEN user_id END)', ['COUNT(*) WHERE signup', 'SUM(user_id)', 'COUNT(type)'], 'Distinct users, not events.', 0),
      Q('Which ACID property means committed data survives a power loss?', 'Durability', ['Atomicity', 'Isolation', 'Consistency'], 'Written to durable storage.', 0),
      Q('Keep only the newest row per email when deduplicating:', 'ROW_NUMBER() OVER (PARTITION BY email ORDER BY created DESC) and keep 1', ['DISTINCT *', 'GROUP BY created', 'DELETE FROM table'], 'Rank within duplicates.', 0),
      Q('An ORM query uses a raw-SQL helper with string concatenation of a search term. In review you should:', 'Flag it and switch to the helper\'s parameter binding', ['Approve — ORMs are always safe', 'Only add a comment', 'Escape spaces'], 'Escape hatches reintroduce injection risk.', 0),
      Q('In this database\'s events table, how many distinct users visited?', '6', ['7', '5', '12'], 'User 4 visited twice; count distinct.', 0),
      T('Type the keyword that undoes the current transaction.', [/^rollback;?$/i], 'ROLLBACK', 0, 'keyword')
    ],
    labs: ['sqx-ddl', 'sqx-upsert', 'sqx-funnel', 'sqx-fix-report']
  });

  slab('sqx-ddl', { title: 'Create a constrained table', mode: 'state', ordered: false, brief: 'Create a table <code>reviews</code> with: <b>id</b> INTEGER PRIMARY KEY; <b>product</b> TEXT NOT NULL that references <code>products(name)</code>; <b>stars</b> INTEGER NOT NULL with a CHECK that it is between 1 and 5; <b>body</b> TEXT. Then insert three reviews: Mouse 5 stars "Great", Monitor 4 stars "Sharp", Cable 2 stars "Frayed".',
    starter: 'CREATE TABLE reviews (\n  -- columns and constraints\n);\n\n-- INSERT INTO reviews (product, stars, body) VALUES ...',
    solution: "CREATE TABLE reviews (id INTEGER PRIMARY KEY, product TEXT NOT NULL REFERENCES products(name), stars INTEGER NOT NULL CHECK (stars BETWEEN 1 AND 5), body TEXT);\nINSERT INTO reviews (product, stars, body) VALUES ('Mouse', 5, 'Great'), ('Monitor', 4, 'Sharp'), ('Cable', 2, 'Frayed');",
    tests: [
      { name: 'Three reviews inserted', sql: 'SELECT product, stars, body FROM reviews ORDER BY product', expect: [['Cable', 2, 'Frayed'], ['Monitor', 4, 'Sharp'], ['Mouse', 5, 'Great']] },
      { name: 'product and stars are NOT NULL', sql: "SELECT COUNT(*) FROM pragma_table_info('reviews') WHERE name IN ('product','stars') AND \"notnull\" = 1", expect: [[2]] },
      { name: 'stars has a CHECK constraint', sql: "SELECT sql LIKE '%CHECK%' FROM sqlite_master WHERE name = 'reviews'", expect: [[1]] },
      { name: 'product references products', sql: "SELECT COUNT(*) FROM pragma_foreign_key_list('reviews') WHERE \"table\" = 'products'", expect: [[1]] },
      { name: 'id is the primary key', sql: "SELECT COUNT(*) FROM pragma_table_info('reviews') WHERE name = 'id' AND pk = 1", expect: [[1]] }
    ],
    hints: ['Column syntax: <code>name TYPE constraints</code>, separated by commas.', '<code>stars INTEGER NOT NULL CHECK (stars BETWEEN 1 AND 5)</code> and <code>product TEXT NOT NULL REFERENCES products(name)</code>.', "One INSERT with three tuples: <code>VALUES ('Mouse', 5, 'Great'), (…), (…);</code>"],
    debrief: 'Constraints are documentation the database enforces. Every rule you encode here is a class of bug that can never reach your reports.' });
  slab('sqx-upsert', { title: 'Restock with an upsert in a transaction', mode: 'state', ordered: false, brief: 'A shipment arrived: <b>Keyboard +10</b>, <b>Webcam +5</b>, and a new product <b>Headset</b> (category <b>audio</b>, stock <b>7</b>). Inside a transaction, apply it with <code>INSERT … ON CONFLICT(name) DO UPDATE</code> so existing products add to their stock and new ones are inserted.',
    starter: 'BEGIN;\n-- INSERT INTO products (name, category, stock) VALUES ...\n-- ON CONFLICT(name) DO UPDATE SET ...\nCOMMIT;',
    solution: "BEGIN;\nINSERT INTO products (name, category, stock) VALUES ('Keyboard', 'peripherals', 10), ('Webcam', 'peripherals', 5), ('Headset', 'audio', 7)\nON CONFLICT(name) DO UPDATE SET stock = stock + excluded.stock;\nCOMMIT;",
    tests: [
      { name: 'Stock levels are correct', sql: 'SELECT name, stock FROM products ORDER BY name', expect: [['Cable', 100], ['Headset', 7], ['Keyboard', 22], ['Monitor', 5], ['Mouse', 30], ['Webcam', 13]] },
      { name: 'Headset added with its category', sql: "SELECT category FROM products WHERE name = 'Headset'", expect: [['audio']] },
      { name: 'No duplicate products', sql: 'SELECT COUNT(*) - COUNT(DISTINCT name) FROM products', expect: [[0]] }
    ],
    hints: ['One INSERT with three rows.', 'Add <code>ON CONFLICT(name) DO UPDATE SET stock = stock + excluded.stock</code>.', 'Wrap it in <code>BEGIN; … COMMIT;</code>.'],
    debrief: 'Upserts make data loads idempotent-friendly and race-safe; transactions make multi-step changes all-or-nothing.' });
  slab('sqx-funnel', { title: 'Signup funnel', brief: 'From <code>events</code>, return one row with <b>visitors</b>, <b>signups</b> and <b>purchasers</b> (distinct users who did each event type) and <b>conversion</b>: purchasers ÷ visitors as a percentage rounded to 1 decimal.',
    solution: "SELECT COUNT(DISTINCT CASE WHEN type = 'visit' THEN user_id END) AS visitors, COUNT(DISTINCT CASE WHEN type = 'signup' THEN user_id END) AS signups, COUNT(DISTINCT CASE WHEN type = 'purchase' THEN user_id END) AS purchasers, ROUND(100.0 * COUNT(DISTINCT CASE WHEN type = 'purchase' THEN user_id END) / COUNT(DISTINCT CASE WHEN type = 'visit' THEN user_id END), 1) AS conversion FROM events;",
    mustUse: ['DISTINCT', 'CASE'],
    hints: ["Distinct users per step: <code>COUNT(DISTINCT CASE WHEN type = 'visit' THEN user_id END)</code>.", 'CASE without ELSE yields NULL, which COUNT ignores.', 'Conversion: <code>ROUND(100.0 * purchasers_expr / visitors_expr, 1)</code>.'],
    debrief: 'Funnels are how product teams measure where users drop off. Counting distinct users (not events) is the detail that makes the number honest.' });
  slab('sqx-fix-report', { title: 'Debug: the category revenue report', brief: 'Finance wants, per product <b>category</b>: <b>units</b> sold and <b>revenue</b> (rounded to 2), only for categories with revenue <b>over 100</b>, highest revenue first. The query has <b>four bugs</b> — it doesn\'t even run yet.',
    starter: "SELECT p.category, SUM(o.qty) AS units, SUM(o.qty * o.price) AS revenue\nFROM orders o\nJOIN products p ON o.product = p.category\nWHERE SUM(o.qty * o.price) > 100\nGROUP BY p.name\nORDER BY revenue;",
    solution: "SELECT p.category, SUM(o.qty) AS units, ROUND(SUM(o.qty * o.price), 2) AS revenue FROM orders o JOIN products p ON o.product = p.name GROUP BY p.category HAVING SUM(o.qty * o.price) > 100 ORDER BY revenue DESC;",
    mustUse: ['HAVING'],
    hints: ['Error first: aggregates are not allowed in WHERE — move that filter to HAVING (after GROUP BY).', 'The join compares a product name to a category: it should be <code>o.product = p.name</code>.', 'Group by <code>p.category</code> (not name), and sort DESC for "highest first".'],
    debrief: 'Wrong join key, wrong grain, WHERE vs HAVING, and sort direction. Reading a query clause by clause against the requirement catches all four.' });
})();

/* Git track */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'git1', track: 'git', tier: 'git-f', title: 'The three areas: add, commit, log', code: 'git commit -m "init"',
    goal: 'How Git tracks changes, the staging model, and your first clean history.',
    lesson: [
      { h: 'What Git is', html: '<p>Git is a <b>version control system</b>: it records snapshots of your project over time so you can see history, undo mistakes, and collaborate. Every developer lives in it daily.</p>' },
      { h: 'The three areas', html: '<pre>Working directory  →  Staging area (index)  →  Repository (commits)\n   (your edits)         git add               git commit</pre><ul><li><b>Working directory</b> — your actual files as you edit them.</li><li><b>Staging area</b> — a snapshot you\'re <i>about</i> to commit. <code>git add</code> moves changes here.</li><li><b>Repository</b> — the permanent history. <code>git commit</code> records the staged snapshot as a new commit.</li></ul><div class="callout pro"><b class="k">Why staging exists</b>You can craft a commit from exactly the changes you want — not everything you touched. Pros commit small, logical units, not "stuff".</div>' },
      { h: 'The core loop', html: '<pre>git init                       # start tracking this folder (once)\ngit config user.name "Phil"    # identify yourself (once)\ngit config user.email "p@x.com"\n\ngit status                     # what changed? (run this constantly)\ngit add file.txt               # stage a file   (git add . = everything)\ngit commit -m "Add feature"    # record a snapshot with a message\ngit log --oneline              # view history</pre>' },
      { h: 'Reading status & undoing', html: '<ul><li><code>git status</code> — the command you run most. Shows staged, modified and untracked files.</li><li><code>git diff</code> — unstaged changes; <code>git diff --staged</code> — staged changes.</li><li><code>git restore file</code> — discard working changes; <code>git restore --staged file</code> — unstage.</li><li>Good commit messages: imperative and specific — "Add login validation", not "stuff".</li></ul>' }
    ],
    cards: [
      ['Version control', 'System that records snapshots of your project over time.'], ['Working directory', 'Your files as you currently edit them.'], ['Staging area (index)', 'Changes prepared for the next commit.'], ['Repository', 'The committed history.'],
      ['git init', 'Start a new Git repository in a folder.'], ['git add', 'Stage changes for the next commit (git add . = all).'], ['git commit -m', 'Record the staged snapshot with a message.'], ['git status', 'Show what is staged, modified and untracked.'], ['git log --oneline', 'Compact history, one commit per line.'],
      ['git diff', 'Show unstaged changes.'], ['git diff --staged', 'Show staged changes.'], ['git restore --staged f', 'Unstage a file.'], ['Commit message', 'Imperative and specific: "Add X", "Fix Y".'], ['git config user.name', 'Identify who makes commits.']
    ],
    qs: [
      Q('Which command stages a file for the next commit?', 'git add', ['git commit', 'git stage', 'git push'], 'git add moves changes to staging.', 0),
      Q('What are the three areas of Git?', 'Working directory, staging area, repository', ['Local, remote, cloud', 'Head, body, tail', 'Add, commit, push'], 'The three areas.', 0),
      Q('Record the staged snapshot with a message. Which command?', 'git commit -m "msg"', ['git save "msg"', 'git add -m "msg"', 'git record "msg"'], 'commit -m.', 0),
      Q('Which command do you run most, to see what changed?', 'git status', ['git log', 'git diff', 'git show'], 'status constantly.', 0),
      Q('git add . does what?', 'Stages all changes in the current directory', ['Commits everything', 'Creates a repo', 'Deletes files'], 'Stage all.', 0),
      Q('View a compact one-line-per-commit history.', 'git log --oneline', ['git history', 'git show --short', 'git commits'], 'log --oneline.', 0),
      Q('Why does the staging area exist?', 'So you can commit exactly the changes you choose, in logical units', ['To back up files to the cloud', 'To compress files', 'It is required by the OS'], 'Crafted commits.', 0),
      Q('You staged a file by mistake. Unstage it with:', 'git restore --staged file', ['git delete file', 'git commit --undo', 'git add --remove file'], 'restore --staged.', 0),
      Q('A good commit message is:', 'Imperative and specific: "Add input validation"', ['"stuff"', 'As long as possible', 'The date only'], 'Clear and specific.', 0),
      Q('git init does what?', 'Starts tracking the current folder as a Git repository', ['Downloads a repo', 'Deletes history', 'Pushes to GitHub'], 'Initialize.', 0),
      Q('What does git diff (no args) show?', 'Changes in the working directory not yet staged', ['Staged changes', 'The commit history', 'Remote branches'], 'Unstaged diff.', 0),
      Q('Before your first commit works, what must you set?', 'git config user.name and user.email', ['A remote', 'A branch', 'An SSH key'], 'Identity for commits.', 0),
      T('Type the command to commit staged changes with the message "Initial commit".', [/git commit -m\s+["']Initial commit["']/], 'git commit -m "Initial commit"', 0, 'git commit ...')
    ],
    labs: ['gt-first']
  });

  S.push({
    id: 'git2', track: 'git', tier: 'git-c', title: 'Branches, merges & remotes', code: 'git checkout -b feature',
    goal: 'Work in parallel with branches, combine work with merges, resolve conflicts, and sync with a remote.',
    lesson: [
      { h: 'Branches', html: '<p>A <b>branch</b> is a movable pointer to a line of work. You branch off to build a feature without disturbing <code>main</code>, then merge it back.</p><pre>git branch                 # list branches (* = current)\ngit switch -c feature      # create AND switch (older: git checkout -b)\n# ...edit, add, commit on feature...\ngit switch main            # back to main\ngit merge feature          # bring feature\'s commits into main</pre>' },
      { h: 'Fast-forward vs merge commit', html: '<ul><li>If main hasn\'t moved since you branched, Git just slides the pointer forward — a <b>fast-forward</b>.</li><li>If both moved, Git makes a <b>merge commit</b> that joins the two histories.</li></ul>' },
      { h: 'Conflicts', html: '<p>When two branches changed the <b>same lines</b>, Git can\'t decide and marks a <b>conflict</b>:</p><pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nyour version\n=======\ntheir version\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</pre><p>You edit the file to the correct final content (removing the markers), <code>git add</code> it, and <code>git commit</code> to complete the merge. Conflicts are normal — not errors.</p>' },
      { h: 'Remotes: push & pull', html: '<pre>git remote add origin https://github.com/you/repo.git\ngit push -u origin main     # upload commits (set upstream the first time)\ngit pull                    # fetch + merge others\' commits\ngit clone <url>             # copy a repo locally</pre><div class="callout pro"><b class="k">Everyday flow</b>pull → branch → edit → add → commit → push → open a pull request. Commit small and often; push when a logical chunk is done.</div>' },
      { h: 'Undo toolkit', html: '<ul><li><code>git restore file</code> — discard working changes.</li><li><code>git reset --soft HEAD~1</code> — undo last commit, keep changes staged; <code>--hard</code> — discard them (careful).</li><li><code>git revert &lt;commit&gt;</code> — a new commit that undoes an old one (safe for shared history).</li><li><code>git stash</code> — shelve changes temporarily; <code>git stash pop</code> to bring them back.</li></ul>' }
    ],
    cards: [
      ['Branch', 'A movable pointer to a line of development.'], ['git switch -c name', 'Create and switch to a new branch (or git checkout -b).'], ['git merge branch', 'Combine another branch\'s commits into the current one.'], ['Fast-forward', 'Merge by sliding the pointer when no divergence occurred.'], ['Merge commit', 'A commit joining two diverged branches.'],
      ['Merge conflict', 'Same lines changed on both branches; you resolve manually.'], ['Conflict markers', '<<<<<<< ======= >>>>>>> around the two versions.'], ['git remote add origin', 'Register a remote repository URL.'], ['git push -u origin main', 'Upload commits and set the upstream.'], ['git pull', 'Fetch and merge remote changes.'], ['git clone', 'Copy a remote repository locally.'],
      ['git revert', 'Create a new commit that undoes a past commit (safe).'], ['git reset --hard', 'Move the branch and discard changes (dangerous).'], ['git stash', 'Temporarily shelve uncommitted changes.'], ['HEAD', 'Pointer to your current commit/branch.']
    ],
    qs: [
      Q('Create a new branch and switch to it in one command.', 'git switch -c feature', ['git branch feature', 'git merge feature', 'git checkout feature'], 'switch -c (or checkout -b).', 0),
      Q('Bring the commits from feature into main. On main, run:', 'git merge feature', ['git pull feature', 'git branch feature', 'git add feature'], 'merge.', 0),
      Q('A merge conflict means:', 'The same lines were changed on both branches', ['Git is broken', 'You lost your work', 'The remote is down'], 'Conflicting edits.', 0),
      Q('After editing a conflicted file to the correct content, you:', 'git add the file, then git commit', ['git push immediately', 'delete the repo', 'git branch again'], 'Stage then commit to finish the merge.', 0),
      Q('Upload your commits to GitHub for the first time.', 'git push -u origin main', ['git upload main', 'git commit --remote', 'git clone main'], 'push -u sets upstream.', 0),
      Q('Download others\' new commits into your branch.', 'git pull', ['git push', 'git fetch only, never merge', 'git clone'], 'pull = fetch + merge.', 0),
      Q('Safely undo an old commit on a shared branch.', 'git revert <commit>', ['git reset --hard', 'delete the commit', 'git rm'], 'revert is safe for shared history.', 0),
      Q('Temporarily shelve changes to switch tasks.', 'git stash', ['git delete', 'git commit --temp', 'git branch'], 'stash and later stash pop.', 0),
      Q('A fast-forward merge happens when:', 'The target branch has not advanced since you branched', ['There is a conflict', 'Both branches diverged', 'You force push'], 'Pointer slides forward.', 0),
      Q('What do the markers <<<<<<< and >>>>>>> indicate?', 'The two conflicting versions you must reconcile', ['Deleted lines', 'Comments', 'A syntax error'], 'Conflict markers.', 0),
      Q('git reset --hard HEAD~1 does what?', 'Removes the last commit AND discards its changes', ['Safely undoes a commit keeping changes', 'Creates a branch', 'Pushes to origin'], 'Destructive — use carefully.', 0),
      Q('The everyday collaboration flow is roughly:', 'pull → branch → edit → add → commit → push → PR', ['push → pull → delete', 'clone → reset → force', 'commit → revert → stash'], 'Standard flow.', 0),
      T('Type the command to merge a branch named "dev" into your current branch.', [/git merge dev/], 'git merge dev', 0, 'git merge ...')
    ],
    labs: ['gt-branch', 'gt-conflict']
  });

  // ---------- labs ----------
  L['gt-first'] = {
    kind: 'git', title: 'Your first commits', brief: 'A fresh folder. Build a clean history:<br>1) <code>git init</code> and set your name/email with <code>git config</code>.<br>2) Create a file: <code>echo "# My Project" &gt; README.md</code>, stage and commit it ("Add README").<br>3) Create <code>app.py</code> with any content, stage and commit it ("Add app").<br>End with <b>2 commits</b> and a clean working tree.',
    tasks: [
      { t: 'Repository initialized and identity set', c: function (r) { return r.inited && r.user.name; } },
      { t: 'At least 2 commits exist', c: function (r) { return Object.keys(r.commits).length >= 2; } },
      { t: 'README.md and app.py are committed', c: function (r) { var t = r.tree(r.head()); return t['README.md'] !== undefined && t['app.py'] !== undefined; } },
      { t: 'Working tree is clean (nothing uncommitted)', c: function (r) { var s = r.status(); return r.inited && !s.staged.length && !s.notStaged.length && !s.untracked.length; } }
    ],
    hints: ['<code>git init</code>, then <code>git config user.name "Phil"</code> and <code>git config user.email "p@x.com"</code>.', '<code>echo "# My Project" > README.md</code> then <code>git add README.md</code> then <code>git commit -m "Add README"</code>.', 'Repeat for app.py. Check with <code>git status</code> and <code>git log --oneline</code>.'],
    solution: ['git init', 'git config user.name "Phil"', 'git config user.email "p@x.com"', 'echo "# My Project" > README.md', 'git add README.md', 'git commit -m "Add README"', 'echo "print(1)" > app.py', 'git add app.py', 'git commit -m "Add app"', 'git log --oneline'],

/* Windows track — CMD + PowerShell (concept + read-the-command, no sandbox) */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'win1', track: 'win', tier: 'win-f', title: 'The Command Prompt (CMD)', code: 'dir /s *.log',
    goal: 'Navigate and manage files from the classic Windows command line, and map it to what you know from Linux.',
    lesson: [
      { h: 'CMD basics', html: '<p>Open with <b>cmd.exe</b>. The prompt shows the current path: <code>C:\\Users\\Phil&gt;</code>. Windows paths use <b>backslashes</b> and <b>drive letters</b> (<code>C:</code>), and are <b>case-insensitive</b>.</p>' },
      { h: 'Core commands (and their Linux cousins)', html: '<table><tr><th>CMD</th><th>Does</th><th>Linux</th></tr><tr><td><code>cd</code></td><td>Change directory (<code>cd ..</code> up)</td><td>cd</td></tr><tr><td><code>cd</code> (alone)</td><td>Print current dir</td><td>pwd</td></tr><tr><td><code>dir</code></td><td>List files</td><td>ls</td></tr><tr><td><code>type file</code></td><td>Print a file</td><td>cat</td></tr><tr><td><code>copy</code> / <code>move</code></td><td>Copy / move</td><td>cp / mv</td></tr><tr><td><code>del</code> / <code>erase</code></td><td>Delete a file</td><td>rm</td></tr><tr><td><code>md</code> / <code>mkdir</code></td><td>Make directory</td><td>mkdir</td></tr><tr><td><code>rd</code> / <code>rmdir</code></td><td>Remove directory</td><td>rmdir</td></tr><tr><td><code>cls</code></td><td>Clear screen</td><td>clear</td></tr><tr><td><code>findstr</code></td><td>Search text in files</td><td>grep</td></tr><tr><td><code>where</code></td><td>Locate a program</td><td>which</td></tr></table>' },
      { h: 'Flags, wildcards, pipes', html: '<ul><li>Options use a <b>slash</b>: <code>dir /s</code> (recurse subfolders), <code>dir /a</code> (show hidden), <code>del /q</code> (quiet).</li><li>Wildcards <code>*</code> and <code>?</code> work: <code>dir *.txt</code>, <code>del temp?.log</code>.</li><li>Pipes <code>|</code> and redirection <code>&gt; &gt;&gt;</code> work like Linux: <code>dir | findstr .log</code>, <code>ipconfig &gt; net.txt</code>.</li><li>Variables use <b>percent signs</b>: <code>%USERNAME%</code>, <code>%PATH%</code>, <code>%CD%</code>. Set one with <code>set NAME=value</code>.</li></ul>' },
      { h: 'Useful system commands', html: '<ul><li><code>ipconfig</code> (network — like <code>ip addr</code>), <code>ping</code>, <code>tracert</code> (Linux traceroute), <code>nslookup</code>.</li><li><code>tasklist</code> / <code>taskkill /PID n</code> (processes), <code>systeminfo</code>, <code>hostname</code>, <code>whoami</code>.</li><li><code>sfc /scannow</code>, <code>chkdsk</code> (repair). Run as administrator for system changes.</li></ul>' }
    ],
    cards: [
      ['dir', 'List files (Linux ls). /s recurse, /a show hidden.'], ['cd', 'Change directory; cd alone prints the current path.'], ['type file', 'Print a file (Linux cat).'], ['copy / move', 'Copy / move files (cp / mv).'], ['del / erase', 'Delete a file (rm).'], ['md / rd', 'Make / remove directory.'], ['cls', 'Clear the screen (clear).'],
      ['findstr', 'Search for text (grep). findstr ERROR app.log.'], ['where', 'Locate a program (which).'], ['Windows paths', 'Backslashes and drive letters: C:\\Users\\Phil. Case-insensitive.'], ['Flags use /', 'dir /s, del /q.'], ['%VAR%', 'Environment variable in CMD: %USERNAME%, %PATH%.'], ['set NAME=val', 'Set a CMD variable.'], ['ipconfig', 'Show network configuration (Linux ip addr).'], ['tasklist / taskkill', 'List / kill processes.']
    ],
    qs: [
      Q('Which CMD command lists files in a directory?', 'dir', ['ls', 'list', 'show'], 'dir is the Windows ls.', 0),
      Q('Print a file\'s contents in CMD.', 'type file.txt', ['cat file.txt', 'print file.txt', 'read file.txt'], 'type (CMD) ≈ cat (Linux).', 0),
      Q('Search for the text ERROR inside app.log in CMD.', 'findstr ERROR app.log', ['grep ERROR app.log', 'search ERROR app.log', 'find ERROR'], 'findstr is grep for Windows.', 0),
      Q('How are command options written in CMD?', 'With a slash: dir /s', ['With a dash: dir -s', 'With two dashes: dir --s', 'No flags allowed'], 'CMD flags use /.', 0),
      Q('Windows file paths use which separator?', 'Backslash \\', ['Forward slash /', 'Colon :', 'Pipe |'], 'C:\\Users\\Phil.', 0),

  S.push({
    id: 'win2', track: 'win', tier: 'win-c', title: 'PowerShell: objects & the pipeline', code: 'Get-Process | Sort CPU',
    goal: 'The modern Windows shell — where the pipeline carries objects, not text.',
    lesson: [
      { h: 'Why PowerShell is different', html: '<p>In bash and CMD, pipes carry <b>text</b>. In PowerShell, pipes carry <b>objects</b> with real properties. That means no fragile text parsing — you filter and sort by actual fields.</p>' },
      { h: 'Cmdlets: Verb-Noun', html: '<p>Commands are named <b>Verb-Noun</b>: <code>Get-ChildItem</code>, <code>Get-Process</code>, <code>Set-Location</code>, <code>Copy-Item</code>, <code>Remove-Item</code>. Common aliases make them feel familiar: <code>ls</code>/<code>dir</code>→Get-ChildItem, <code>cd</code>→Set-Location, <code>cat</code>→Get-Content, <code>cp</code>→Copy-Item, <code>rm</code>→Remove-Item, <code>pwd</code>→Get-Location.</p>' },
      { h: 'The object pipeline', html: '<pre># top 5 processes by memory\nGet-Process | Sort-Object WorkingSet -Descending | Select-Object -First 5\n\n# only running services\nGet-Service | Where-Object { $_.Status -eq "Running" }\n\n# files over 1MB, just name and size\nGet-ChildItem | Where-Object { $_.Length -gt 1MB } | Select-Object Name, Length</pre><ul><li><code>Where-Object { $_.Field -op value }</code> filters (like SQL WHERE / bash grep). <code>$_</code> is the current object.</li><li>Operators are words: <code>-eq -ne -gt -lt -ge -le -like -match</code>.</li><li><code>Select-Object</code> picks properties; <code>Sort-Object</code> sorts; <code>Measure-Object</code> aggregates.</li></ul>' },
      { h: 'Variables, loops & scripts', html: '<pre>$name = "Phil"\nWrite-Output "Hi $name"           # "..." expands $name\n$files = Get-ChildItem *.log\nforeach ($f in $files) { Write-Output $f.Name }\n\nif ($count -gt 10) { ... } else { ... }</pre><p>Variables start with <code>$</code>. Scripts are <code>.ps1</code> files. (Execution policy may need <code>Set-ExecutionPolicy</code> to run them.) <code>Get-Help &lt;cmdlet&gt;</code> and <code>Get-Member</code> (to see an object\'s properties) are your reference.</p>' }
    ],
    cards: [
      ['PowerShell pipeline', 'Carries objects with properties, not plain text.'], ['Verb-Noun', 'Cmdlet naming: Get-Process, Set-Location, Remove-Item.'], ['Get-ChildItem', 'List items (alias ls/dir).'], ['Get-Content', 'Read a file (alias cat).'], ['Where-Object { }', 'Filter objects. $_ is the current object.'], ['$_', 'The current pipeline object.'],
      ['-eq -gt -like', 'Comparison operators are words, not symbols.'], ['Select-Object', 'Pick properties or first/last N.'], ['Sort-Object', 'Sort by a property.'], ['Measure-Object', 'Count/sum/average a property.'], ['$var', 'Variables start with a dollar sign.'], ['Write-Output', 'Print (also Write-Host).'], ['.ps1', 'A PowerShell script file.'], ['Get-Member', 'Discover an object\'s properties and methods.']
    ],
    qs: [
      Q('What does a PowerShell pipeline carry between commands?', 'Objects with properties', ['Plain text', 'File handles', 'Bytes only'], 'Objects, not text.', 0),
      Q('PowerShell cmdlets are named:', 'Verb-Noun (Get-Process)', ['noun.verb()', 'all lowercase', 'VERB_NOUN'], 'Verb-Noun.', 0),
      Q('Filter to only running services. Which cmdlet?', 'Where-Object { $_.Status -eq "Running" }', ['Select-Object Running', 'grep Running', 'Filter Running'], 'Where-Object with $_.', 0),
      Q('In Where-Object, what does $_ mean?', 'The current object in the pipeline', ['The whole collection', 'The previous command', 'A wildcard'], '$_ = current item.', 0),
      Q('Equality comparison in PowerShell is:', '-eq', ['==', '=', '.equals'], 'Word operators: -eq.', 0),
      Q('Pick just the Name and Length properties.', 'Select-Object Name, Length', ['cut -f Name', 'Get Name Length', 'Pick Name Length'], 'Select-Object.', 0),
      Q('List files (what is Get-ChildItem aliased to)?', 'ls and dir', ['only gci', 'cat', 'find'], 'ls/dir/gci all work.', 0),
      Q('Variables in PowerShell start with:', '$', ['%', '@', 'var'], '$name.', 0),
      Q('Read a file\'s contents in PowerShell.', 'Get-Content file.txt', ['type file.txt only', 'Read-File', 'Open-Item'], 'Get-Content (alias cat).', 0),
      Q('Discover what properties an object has.', 'Get-Member', ['Get-Help', 'Get-Props', 'Describe-Object'], 'Get-Member.', 0),
      Q('Why is the object pipeline better than text pipes for scripting?', 'You filter/sort by real fields instead of parsing fragile text', ['It is always faster', 'It uses less memory', 'It needs no cmdlets'], 'No text parsing.', 0),
      Q('Sort processes by CPU descending, take top 3.', 'Get-Process | Sort-Object CPU -Descending | Select-Object -First 3', ['Get-Process | top 3', 'ps | sort CPU | head', 'Get-Process /sort'], 'Sort-Object then Select -First.', 0),
      T('Type the cmdlet that lists running processes (Verb-Noun).', [/Get-Process/i], 'Get-Process', 0, 'Get-...')
    ],
    labs: []
  });
})();

/* C++ track */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, P = window.PRED, L = COURSE.labs;

  S.push({
    id: 'cpp1', track: 'cpp', tier: 'cpp-f', title: 'Types, I/O & control flow', code: 'int main() { return 0; }',
    goal: 'The structure of a C++ program, strong typing, input/output, and functions.',
    lesson: [
      { h: 'Anatomy of a program', html: '<pre>#include &lt;iostream&gt;   // bring in input/output\nusing namespace std; // so we can write cout, not std::cout\n\nint main() {         // execution starts here\n    cout &lt;&lt; "Hello" &lt;&lt; endl;   // print, then newline\n    return 0;        // 0 = success\n}</pre><p>Every statement ends with <code>;</code>. Blocks use <code>{ }</code>. <code>main</code> returns an <code>int</code> exit code.</p>' },
      { h: 'Static typing', html: '<p>Unlike Python/JS, you declare a type and it can\'t change. The compiler checks types before the program runs.</p><pre>int age = 27;        // whole number\ndouble price = 9.99; // floating point\nchar grade = \'A\';    // single character (single quotes)\nbool ok = true;\nstring name = "Phil";  // #include &lt;string&gt;\nconst int MAX = 100;   // can\'t change</pre><div class="callout trap"><b class="k">Integer division</b><code>7 / 2</code> is <code>3</code> (both ints → integer division). For <code>3.5</code> make one a double: <code>7.0 / 2</code>. And <code>\'A\'</code> uses single quotes; <code>"A"</code> is a string.</div>' },
      { h: 'Input and output', html: '<pre>int x;\ncin &gt;&gt; x;              // read an int from input\nstring word;\ncin &gt;&gt; word;           // read one whitespace-delimited word\ncout &lt;&lt; "x is " &lt;&lt; x &lt;&lt; endl;</pre><p><code>&lt;&lt;</code> sends to output (chainable); <code>&gt;&gt;</code> reads from input.</p>' },
      { h: 'Control flow & functions', html: '<pre>if (score &gt;= 90) { cout &lt;&lt; "A"; }\nelse if (score &gt;= 80) { cout &lt;&lt; "B"; }\nelse { cout &lt;&lt; "C"; }\n\nfor (int i = 0; i &lt; 5; i++) cout &lt;&lt; i;      // 01234\n\nint n = 3;\nwhile (n &gt; 0) { cout &lt;&lt; n; n--; }           // 321\n\nint add(int a, int b) {   // return type comes first\n    return a + b;\n}</pre><p>Functions declare their return type and each parameter\'s type. <code>void</code> means "returns nothing".</p>' }
    ],
    cards: [
      ['#include <iostream>', 'Bring in input/output facilities.'], ['int main()', 'Program entry point; returns an exit code.'], ['cout <<', 'Send values to standard output (chainable).'], ['cin >>', 'Read a value from standard input.'], ['endl / "\\n"', 'End the line.'], ['Static typing', 'Every variable has a fixed type checked at compile time.'],
      ['int / double / char / bool', 'Integer / decimal / single character / true-false.'], ['string', 'Text type (#include <string>).'], ['const', 'A value that cannot change.'], ['Integer division', '7 / 2 == 3 when both are ints.'], ['Single vs double quotes', "'A' is a char; \"A\" is a string."],
      ['if/else if/else', 'Conditional branching with { } blocks.'], ['for (int i=0;i<n;i++)', 'Classic counting loop.'], ['Function signature', 'returnType name(type param, ...).'], ['void', 'Function returns nothing.'], ['; and { }', 'Statements end with ;, blocks use braces.']
    ],
    qs: [
      P('#include <iostream>\nusing namespace std;\nint main(){ cout << 7 / 2; }', '3', ['3.5', '4', '2'], 'Integer division truncates.', 'C++'),
      P('cout << 7.0 / 2;', '3.5', ['3', '4', '3.0'], 'One double → floating point division.', 'C++'),
      P('int x = 5;\ncout << x * x;', '25', ['10', '55', 'x*x'], '5 squared.', 'C++'),
      P('for (int i = 1; i <= 3; i++) cout << i;', '123', ['1 2 3', '0123', '321'], 'Prints 1,2,3 with no spaces.', 'C++'),
      P('int n = 3;\nwhile (n > 0) { cout << n; n--; }', '321', ['123', '3210', '3'], 'Counts down.', 'C++'),
      Q('Which is a single character literal?', "'A'", ['"A"', '`A`', 'char(A)'], "Single quotes = char.", 0),
      Q('main returns 0 to mean:', 'The program succeeded', ['An error', 'Infinity', 'Nothing'], '0 = success exit code.', 0),
      Q('How do you read an integer from input?', 'cin >> x;', ['input(x);', 'x = read();', 'cin << x;'], '>> reads; << writes.', 0),
      Q('What does static typing mean?', 'Variable types are fixed and checked at compile time', ['Types can change anytime', 'There are no types', 'Everything is a string'], 'Compile-time type checking.', 0),
      P('int a = 10, b = 3;\ncout << a % b;', '1', ['3', '0', '3.33'], '10 mod 3 = 1.', 'C++'),
      Q('A function that returns nothing has return type:', 'void', ['null', 'none', 'int'], 'void.', 0),
      Q('Every simple statement in C++ ends with:', 'A semicolon ;', ['A newline', 'A period', 'A brace'], 'Semicolons.', 0),
      P('bool ok = (5 > 3);\ncout << ok;', '1', ['true', 'yes', '0'], 'cout prints bool as 1/0.', 'C++'),
      T('Write the function signature line for int add(a, b) taking two ints.', [/int add\(int a,\s*int b\)/], 'int add(int a, int b)', 0, 'int add(...)')
    ],
    labs: ['cp-hello', 'cp-sum']
  });

  S.push({
    id: 'cpp2', track: 'cpp', tier: 'cpp-c', title: 'Memory, pointers, references & objects', code: 'int* p = &x;',
    goal: 'What makes C++ powerful and feared: pointers, references, vectors, and classes.',
    lesson: [
      { h: 'The stack and memory', html: '<p>Local variables live on the <b>stack</b> and vanish when the function returns. You can also ask for memory on the <b>heap</b> (<code>new</code>/<code>delete</code>) that you manage yourself. Every variable has an <b>address</b> in memory.</p>' },
      { h: 'Pointers & references', html: '<pre>int x = 42;\nint* p = &x;    // p holds the ADDRESS of x (& = "address of")\ncout << *p;     // 42   (* = "value at" — dereference)\n*p = 99;        // changes x through the pointer → x is now 99\n\nint& r = x;     // reference: another name for x\nr = 7;          // x is now 7</pre><ul><li><code>&x</code> = address of x; <code>*p</code> = the value p points to.</li><li>A <b>reference</b> (<code>int&amp;</code>) is an alias — commonly used to pass variables to functions so the function can modify them (pass by reference) and to avoid copying big objects.</li></ul><div class="callout trap"><b class="k">The classic bugs</b>A pointer that points nowhere valid (dangling/null) crashes with a segfault. Memory from <code>new</code> that is never <code>delete</code>d is a <b>memory leak</b>. Modern C++ prefers <b>smart pointers</b> (<code>unique_ptr</code>, <code>shared_ptr</code>) and containers so you rarely manage raw memory by hand.</div>' },
      { h: 'Vectors (the array you want)', html: '<pre>#include &lt;vector&gt;\nvector&lt;int&gt; v = {3, 1, 4};\nv.push_back(9);     // add to end\nv[0];               // 3\nv.size();           // 4\nfor (int n : v) cout &lt;&lt; n;   // range-based for\nsort(v.begin(), v.end());    // #include &lt;algorithm&gt;</pre><p><code>vector</code> is a dynamic array that grows automatically — use it instead of raw C arrays.</p>' },

  S.push({
    id: 'cpp4', track: 'cpp', tier: 'cpp-adv', title: 'Modern C++: RAII, smart pointers, move & templates', code: 'auto p = make_unique<T>();', gateN: 12,
    goal: 'The ideas that make modern C++ safe and fast: RAII and object lifetime, unique_ptr/shared_ptr instead of new/delete, move semantics, the Rule of Zero, templates, and const-correctness.',
    lesson: [
      { h: 'RAII: resources tied to lifetime', html: '<p><b>R</b>esource <b>A</b>cquisition <b>I</b>s <b>I</b>nitialization: an object acquires a resource in its <b>constructor</b> and releases it in its <b>destructor</b>. Destructors run automatically when the object goes out of scope — even if an exception is thrown.</p><pre>{\n    ifstream f("data.txt");     // opens the file\n    lock_guard&lt;mutex&gt; g(m);     // locks the mutex\n    auto buf = make_unique&lt;char[]&gt;(4096);  // allocates\n    …\n}   // ← leaving scope: buf freed, mutex unlocked, file closed. In reverse order.</pre><p>Objects are destroyed in the <b>reverse order</b> they were constructed. This is why idiomatic C++ almost never calls <code>delete</code>, <code>close()</code> or <code>unlock()</code> by hand.</p>' },
      { h: 'Smart pointers', html: '<pre>#include &lt;memory&gt;\nauto p = make_unique&lt;Widget&gt;(42);   // sole owner; freed automatically\np-&gt;run();\nauto q = std::move(p);                // ownership MOVES to q; p is now null\n// auto r = q;                         // ✗ compile error: unique_ptr can\'t be copied\n\nauto s1 = make_shared&lt;Widget&gt;(7);    // shared ownership, reference counted\nauto s2 = s1;                         // use_count() == 2\n// freed when the LAST shared_ptr goes away\n\nweak_ptr&lt;Widget&gt; w = s1;              // observes without owning (breaks cycles)</pre><table><tr><th>Use</th><th>When</th></tr><tr><td><code>unique_ptr</code></td><td>The default. One clear owner.</td></tr><tr><td><code>shared_ptr</code></td><td>Genuinely shared lifetime (rarer than you think).</td></tr><tr><td>raw <code>T*</code> / <code>T&amp;</code></td><td>Non-owning access only — "I use it, I don\'t free it."</td></tr></table>' },
      { h: 'Move semantics', html: '<p>Copying a big object (a vector of a million strings) is expensive. <b>Moving</b> steals its internals instead — O(1).</p><pre>vector&lt;string&gt; a(1000000, "x");\nvector&lt;string&gt; b = a;            // COPY: a is unchanged, b is a full duplicate\nvector&lt;string&gt; c = std::move(a); // MOVE: c takes a\'s buffer; a is left valid-but-empty\n\nvector&lt;string&gt; make() { vector&lt;string&gt; v; …; return v; }  // returned efficiently (move / copy elision)</pre><p><code>std::move</code> doesn\'t move anything by itself — it <b>casts</b> to an rvalue ("you may steal from me"). After moving from an object, only assign to it or destroy it; don\'t rely on its value.</p>' },
      { h: 'Rule of Zero / Three / Five', html: '<p>If your class manages a raw resource, you must write the destructor, copy constructor, copy assignment (Rule of <b>Three</b>) and usually the move constructor and move assignment (Rule of <b>Five</b>). Forget one and you get double-frees or leaks.</p><p><b>Rule of Zero</b> (the modern answer): don\'t manage raw resources in your classes at all. Hold <code>vector</code>, <code>string</code>, <code>unique_ptr</code> members and let the compiler generate correct copy/move/destroy for you.</p><pre>struct Bad  { int* data; Bad(){ data = new int[100]; } ~Bad(){ delete[] data; } };\n// Bad a; Bad b = a;  → both delete the same memory → double free!\n\nstruct Good { vector&lt;int&gt; data = vector&lt;int&gt;(100); };   // Rule of Zero: nothing to write</pre>' },
      { h: 'Templates & const-correctness', html: '<pre>template &lt;typename T&gt;\nT biggest(const vector&lt;T&gt;&amp; v) {      // works for int, double, string…\n    T best = v[0];\n    for (const T&amp; x : v) if (x &gt; best) best = x;\n    return best;\n}\nbiggest(vector&lt;int&gt;{3, 9, 2});          // T deduced as int\n\ntemplate &lt;typename T&gt;\nstruct Box { T value; T get() const { return value; } };</pre><p>The compiler generates a separate version for each type you use. Errors appear when a type lacks what the template needs (e.g. no <code>&gt;</code>); C++20 <b>concepts</b> (<code>template &lt;std::totally_ordered T&gt;</code>) make those errors readable.</p><p><b>const-correctness:</b> mark parameters <code>const T&amp;</code> when you only read them and member functions <code>const</code> when they don\'t change the object. The compiler then enforces your intent — a whole class of bugs disappears.</p>' }
    ],
    cards: [
      ['RAII', 'Acquire in the constructor, release in the destructor — cleanup is automatic.'], ['Destruction order', 'Reverse of construction when leaving scope.'],

      ['std::move(x)', 'Cast x to an rvalue so it can be moved from.'], ['Moved-from state', 'Valid but unspecified — assign or destroy only.'], ['Copy elision', 'Returning a local by value is cheap.'],
      ['Rule of Three/Five', 'Manage a raw resource? Write dtor, copy/move ctor and assignments.'], ['Rule of Zero', 'Use members that manage themselves; write none of them.'], ['Double free', 'Two owners deleting the same memory — UB.'],
      ['template <typename T>', 'Generic code instantiated per type.'], ['Concepts (C++20)', 'Constrain template parameters with readable errors.'], ['const member function', 'Promises not to modify the object.'], ['const T&', 'Read-only, no-copy parameter.']
    ],
    qs: [
      Q('In RAII, when is a resource released?', 'In the destructor, automatically when the object leaves scope', ['When you call free()', 'At program exit only', 'When the garbage collector runs'], 'C++ has no GC; scope ends lifetime.', 0),
      Q('Two objects created in order A then B in one scope are destroyed in what order?', 'B, then A', ['A, then B', 'Random order', 'Only A is destroyed'], 'Reverse order of construction.', 0),
      Q('auto q = p; where p is a unique_ptr. Result?', 'Compile error — unique_ptr cannot be copied', ['q and p share ownership', 'A deep copy is made', 'p becomes null'], 'Use std::move(p) to transfer.', 0),
