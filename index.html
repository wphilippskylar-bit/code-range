  S.push({
    id: 'cpp2', track: 'cpp', tier: 'cpp-c', title: 'Memory, pointers, references & objects', code: 'int* p = &x;',
    goal: 'What makes C++ powerful and feared: pointers, references, vectors, and classes.',
    lesson: [
      { h: 'The stack and memory', html: '<p>Local variables live on the <b>stack</b> and vanish when the function returns. You can also ask for memory on the <b>heap</b> (<code>new</code>/<code>delete</code>) that you manage yourself. Every variable has an <b>address</b> in memory.</p>' },
      { h: 'Pointers & references', html: '<pre>int x = 42;\nint* p = &x;    // p holds the ADDRESS of x (& = "address of")\ncout << *p;     // 42   (* = "value at" — dereference)\n*p = 99;        // changes x through the pointer → x is now 99\n\nint& r = x;     // reference: another name for x\nr = 7;          // x is now 7</pre><ul><li><code>&x</code> = address of x; <code>*p</code> = the value p points to.</li><li>A <b>reference</b> (<code>int&amp;</code>) is an alias — commonly used to pass variables to functions so the function can modify them (pass by reference) and to avoid copying big objects.</li></ul><div class="callout trap"><b class="k">The classic bugs</b>A pointer that points nowhere valid (dangling/null) crashes with a segfault. Memory from <code>new</code> that is never <code>delete</code>d is a <b>memory leak</b>. Modern C++ prefers <b>smart pointers</b> (<code>unique_ptr</code>, <code>shared_ptr</code>) and containers so you rarely manage raw memory by hand.</div>' },
      { h: 'Vectors (the array you want)', html: '<pre>#include &lt;vector&gt;\nvector&lt;int&gt; v = {3, 1, 4};\nv.push_back(9);     // add to end\nv[0];               // 3\nv.size();           // 4\nfor (int n : v) cout &lt;&lt; n;   // range-based for\nsort(v.begin(), v.end());    // #include &lt;algorithm&gt;</pre><p><code>vector</code> is a dynamic array that grows automatically — use it instead of raw C arrays.</p>' },
      { h: 'Classes & objects', html: '<pre>class Counter {\nprivate:\n    int count = 0;        // hidden from outside\npublic:\n    void increment() { count++; }   // method\n    int get() const { return count; }\n};\n\nCounter c;\nc.increment();\ncout &lt;&lt; c.get();   // 1</pre><ul><li><code>public</code> members are the interface; <code>private</code> hides internal state (<b>encapsulation</b>).</li><li>A <b>constructor</b> (named like the class) initializes a new object; a <b>destructor</b> (<code>~Class()</code>) cleans up.</li><li>Pass big objects by <code>const</code> reference (<code>const string&amp; s</code>) to avoid copies.</li></ul>' }
    ],
    cards: [
      ['&x', 'Address-of: the memory address of x.'], ['int* p', 'A pointer — holds an address.'], ['*p', 'Dereference: the value the pointer points to.'], ['int& r = x', 'A reference: an alias for another variable.'], ['Pass by reference', 'Let a function modify the caller\'s variable / avoid copying.'],
      ['Stack vs heap', 'Automatic local memory vs manually managed (new/delete) memory.'], ['Memory leak', 'Heap memory from new that is never delete-d.'], ['Dangling/null pointer', 'Points to invalid memory → crash (segfault).'], ['Smart pointer', 'unique_ptr/shared_ptr manage memory automatically.'],
      ['vector<T>', 'Dynamic, auto-growing array. push_back, size, [].'], ['Range-based for', 'for (int n : v) iterates values.'], ['class', 'Blueprint bundling data and methods.'], ['public / private', 'Interface vs hidden internal state (encapsulation).'], ['Constructor', 'Initializes a new object; named like the class.'], ['Destructor ~Class()', 'Cleans up when the object is destroyed.'], ['const ref param', 'const string& avoids copying and forbids modification.']
    ],
    qs: [
      P('int x = 5;\nint* p = &x;\n*p = 10;\ncout << x;', '10', ['5', '&x', 'error'], '*p = 10 changes x through the pointer.', 'C++'),
      Q('What does & mean in int* p = &x;?', 'The address of x', ['The value of x', 'A reference declaration here', 'Bitwise and'], '& = address-of.', 0),
      Q('What does * do in cout << *p;?', 'Dereferences — gives the value p points to', ['Multiplies', 'Declares a pointer', 'Takes the address'], '* = value at.', 0),
      Q('A memory leak is:', 'Heap memory allocated with new that is never freed', ['A null pointer', 'An integer overflow', 'A slow loop'], 'Un-freed heap memory.', 0),
      Q('Which container is a dynamic, auto-growing array?', 'vector', ['int[]', 'string', 'pointer'], 'vector.', 0),
      P('vector<int> v = {1, 2};\nv.push_back(3);\ncout << v.size();', '3', ['2', '1', '6'], 'Three elements now.', 'C++'),
      Q('private members of a class are:', 'Hidden from outside code (encapsulation)', ['Accessible everywhere', 'Automatically static', 'The constructor'], 'private = hidden.', 0),
      Q('A reference (int& r = x) is:', 'Another name (alias) for x', ['A copy of x', 'A pointer to x you dereference', 'The address of x'], 'Alias.', 0),
      Q('Why pass a large object as const string& s?', 'To avoid copying it and prevent modification', ['To make it global', 'It is required syntax', 'To allocate on the heap'], 'Efficient, safe.', 0),
      Q('Modern C++ avoids manual new/delete by using:', 'Smart pointers and containers like vector', ['More raw pointers', 'Global variables', 'goto'], 'RAII / smart pointers.', 0),
      Q('A constructor is a special method that:', 'Initializes a new object of the class', ['Deletes an object', 'Is always private', 'Returns an int'], 'Runs on creation.', 0),
      P('int a = 3;\nint& b = a;\nb = 10;\ncout << a;', '10', ['3', '13', 'error'], 'b is an alias for a.', 'C++'),
      Q('A dangling pointer causes:', 'Undefined behavior / a crash (segfault)', ['A compile error always', 'A memory leak', 'Nothing'], 'Invalid access.', 0)
    ],

  // ---------- labs (compile online via Compiler Explorer) ----------
  function clab(o) { o.kind = 'code'; o.lang = 'cpp'; L[o.id] = o; }
  clab({ id: 'cp-hello', title: 'Hello, C++', brief: 'Complete the program so it prints exactly:<br><code>Hello, C++!</code><br>(then a newline). This confirms the online compiler works.',
    starter: '#include <iostream>\nusing namespace std;\n\nint main() {\n    // print Hello, C++!\n    return 0;\n}\n',

  clab({ id: 'cp-sum', title: 'Sum two numbers', brief: 'Read two integers from input (on one line, separated by a space) and print their sum.', stdin: '12 30',

    tests: [{ name: '12 + 30 = 42', stdin: '12 30', expect: '42' }, { name: '-5 + 5 = 0', stdin: '-5 5', expect: '0' }],

    starter: '#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<int> v;\n    // read n numbers into v, then print sum and max\n    return 0;\n}\n',
    tests: [{ name: '5 numbers → sum 66, max 23', stdin: '5\n4 8 15 16 23', expect: '66\n23' }, { name: '3 numbers', stdin: '3\n10 50 20', expect: '80\n50' }],
    hints: ['Loop n times: <code>int x; cin &gt;&gt; x; v.push_back(x);</code>', 'Track a running <code>sum</code> and a <code>best</code> (start best at the first value or a very small number).', 'Range-based: <code>for (int x : v) { sum += x; if (x &gt; best) best = x; }</code>'],

/* AI Prompting track */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'ai1', track: 'ai', tier: 'ai-f', title: 'Prompting that gets elite results', code: 'role + task + context + format',
    goal: 'Structure, context, examples, iteration and verification — how to get professional output from any AI model.',
    lesson: [
      { h: 'A model is a brilliant intern with amnesia', html: '<p>It knows an enormous amount but <b>only what you put in the prompt right now</b>. It cannot read your mind, your files (unless you paste them), or remember last week. Vague in → vague out. Specific, structured in → excellent out.</p>' },
      { h: 'The anatomy of a strong prompt', html: '<ol><li><b>Role</b> — "You are a senior network engineer." Sets the voice and depth.</li><li><b>Task</b> — one clear instruction. "Review this firewall config for security issues."</li><li><b>Context</b> — the facts it needs: the config, the constraints, the audience.</li><li><b>Format</b> — exactly how to answer. "Return a table: issue, severity, fix." or "Answer in 3 bullet points."</li><li><b>Constraints</b> — length, tone, what to avoid. "Under 200 words. No marketing language."</li></ol><pre>You are a senior Python developer.          ← role\nReview the function below for bugs.          ← task\n[paste the code]                             ← context\nReturn: a numbered list of issues, each       ← format\nwith the line number and a one-line fix.\nBe concise; skip style nitpicks.             ← constraints</pre>' },
      { h: 'Techniques that multiply quality', html: '<ul><li><b>Give examples</b> (few-shot): show 1–2 input→output pairs and the model matches the pattern.</li><li><b>Ask for reasoning</b> on hard problems: "Think step by step before answering." It improves correctness on logic/math.</li><li><b>Set the output shape</b>: ask for JSON, a table, or a template when you\'ll use the result programmatically.</li><li><b>Decompose</b>: break a big task into steps and do them in sequence rather than one giant ask.</li><li><b>Give it an out</b>: "If you are unsure or missing information, say so and ask." This cuts confident-but-wrong answers.</li></ul>' },
      { h: 'Iterate and verify', html: '<p>The first answer is a draft. Refine: "Good, but make it shorter and add error handling." You are steering, not one-shotting.</p><div class="callout trap"><b class="k">Always verify</b>Models <b>hallucinate</b> — they can state wrong facts, fake citations, or buggy code with total confidence. <b>Run the code. Check the facts. Test the output.</b> Never ship an AI answer you haven\'t verified, especially in security, legal, or production work. The AI is a force multiplier, not an authority.</div>' },
      { h: 'What not to do', html: '<ul><li>Don\'t paste secrets, passwords, API keys, or customer data into a model you don\'t control.</li><li>Don\'t ask vague one-liners for complex work ("make it better").</li><li>Don\'t trust a cited source without opening it — citations can be invented.</li><li>Don\'t assume it remembers earlier chats unless that context is present.</li></ul>' }
    ],
    cards: [
      ['Context window', 'The prompt is all the model knows right now; it has no hidden memory.'], ['Role', 'Tell the model who to be: "You are a senior SRE."'], ['Task', 'One clear instruction.'], ['Context', 'The facts/data the model needs to do the task.'], ['Format', 'Specify exactly how to answer (table, JSON, bullets).'], ['Constraints', 'Length, tone, what to avoid.'],
      ['Few-shot', 'Give example input→output pairs to set the pattern.'], ['Step by step', 'Asking for reasoning improves hard logic/math answers.'], ['Decompose', 'Break a big task into ordered steps.'], ['Give it an out', 'Tell it to say "I don\'t know" or ask when unsure.'], ['Iterate', 'Refine the draft with follow-up instructions.'],
      ['Hallucination', 'Confident but false output — facts, citations, or code.'], ['Verify', 'Always run the code / check the facts before trusting output.'], ['Don\'t paste secrets', 'Never send passwords, keys, or private data to an untrusted model.'], ['AI is a tool', 'A force multiplier, not an authority.']
    ],
    qs: [
      Q('Why does a vague prompt give a vague answer?', 'The model only works with what you put in the prompt — no hidden context', ['The model is lazy', 'It needs payment', 'Vague prompts are blocked'], 'Garbage in, garbage out.', 0),
      Q('Which element sets the model\'s voice and depth?', 'Role ("You are a senior engineer")', ['Format', 'Length limit', 'Temperature'], 'Role.', 0),
      Q('To get output you\'ll parse programmatically, you should:', 'Specify the exact format (e.g. "return JSON with keys x, y")', ['Ask nicely', 'Use more adjectives', 'Ask twice'], 'Pin the format.', 0),
      Q('Few-shot prompting means:', 'Giving a couple of example input→output pairs', ['Prompting very briefly', 'Using few words', 'Asking few questions'], 'Examples set the pattern.', 0),
      Q('The single most important habit with AI output is:', 'Verify it — run the code, check the facts', ['Trust it fully', 'Always ask for more', 'Never iterate'], 'Verification.', 0),
      Q('A "hallucination" is when the model:', 'States something false with confidence', ['Crashes', 'Refuses to answer', 'Repeats itself'], 'Confident and wrong.', 0),
      Q('For a hard logic or math problem, it helps to:', 'Ask the model to reason step by step', ['Demand a one-word answer', 'Lower the detail', 'Ask faster'], 'Step-by-step reasoning.', 0),
      Q('Which should you NEVER paste into an untrusted model?', 'Passwords, API keys, or customer data', ['Example code', 'A public article', 'Your question'], 'Protect secrets.', 0),
      Q('The model gives a decent but too-long answer. Best move?', 'Iterate: "Make it shorter and add error handling"', ['Start a brand new chat', 'Accept it as-is', 'Ask the same thing again'], 'Refine the draft.', 0),
      Q('"If you are unsure, say so and ask" is useful because it:', 'Reduces confident-but-wrong answers', ['Makes replies longer', 'Disables the model', 'Is required syntax'], 'Cuts hallucinations.', 0),
      Q('Why decompose a big task into steps?', 'Each focused step produces better, checkable output than one giant ask', ['It uses fewer tokens always', 'The model prefers it', 'It is mandatory'], 'Focused steps win.', 0),
      Q('A cited source in an AI answer should be:', 'Opened and checked — citations can be invented', ['Trusted automatically', 'Ignored', 'Copied without reading'], 'Verify citations.', 0)
    ],
    labs: ['ai-structure', 'ai-debug']
  });

  // ---------- prompt rubric labs ----------
  function plab(o) { o.kind = 'code'; o.lang = 'prompt'; L[o.id] = o; }

  S.push({
    id: 'fx1', track: 'fix', tier: 'fix-1', title: 'Read code you didn\'t write', code: 'FIX-READ-TRACE-REPRODUCE', gateN: 12,

    lesson: [
      { h: 'The mindset', html: '<p>Reading someone else\'s code — including code an AI generated for you — is a <b>separate skill</b> from writing your own, and it\'s the one that lets you trust (or not trust) a "vibe-coded" draft. The goal isn\'t to admire it; it\'s to <b>build an accurate mental model of what it actually does</b>, which is often not what it claims to do.</p>' },
      { h: 'Narrate and trace', html: '<ul><li><b>Read top to bottom and say each line out loud in plain English.</b> "Start total at 0. Loop i from 1 to 99. Add i to total." The moment your narration doesn\'t match the intent, you\'ve found the bug.</li><li><b>Trace one input by hand.</b> Pick a small example, and on paper track every variable as the lines run. Computers don\'t guess; if you follow the exact steps, you get the exact (wrong) answer it gets.</li></ul>' },
      { h: 'Reproduce, then read the error', html: '<p><b>Reproduce first.</b> Run it and see the real output next to the expected output — you can\'t fix what you can\'t trigger. If it crashes, the <b>error / traceback</b> is a gift, not an insult:</p><pre>Traceback (most recent call last):\n  File "&lt;your code&gt;", line 6, in &lt;module&gt;\n    print("average:", avgg)\nNameError: name \'avgg\' is not defined</pre><p>Read it <b>bottom-up</b>: the last line is the <b>kind</b> of error and the message; just above is the <b>exact line</b>. That\'s your first suspect, every time. (<code>NameError</code> = a name/typo it can\'t find; <code>TypeError</code> = wrong kind of value; <code>IndexError</code> = position past the end.)</p>' },
      { h: 'Isolate — don\'t guess-edit', html: '<div class="callout pro"><b class="k">Find WHERE before you change WHAT</b><ul><li><b>Print/log intermediate values</b> to see where reality first diverges from what you expected.</li><li><b>Shrink the input</b> to the smallest case that still fails.</li><li><b>Comment out</b> parts to cut the problem in half (bisect).</li><li>Only change a line <b>once you understand why it\'s wrong</b>. Random edits create two bugs where there was one.</li></ul></div>' }
    ],
    cards: [
      ['Reading ≠ writing', 'Understanding unfamiliar code is its own skill — the one that lets you vet AI output.'],

    qs: [
      Q('The first thing to do with a bug report is:', 'Reproduce it — run the code and see the real vs expected output', ['Rewrite the whole file', 'Guess a fix and ship it', 'Assume it\'s fine'], 'You can\'t fix what you can\'t trigger.'),
      Q('How do you read a traceback / error?', 'Bottom-up: the last line names the error, the line above shows where', ['Top-down only', 'Ignore it', 'Only the first word'], 'The bottom is the point of failure.'),
      Q('A NameError usually means:', 'A name or typo the program can\'t find', ['The file is too big', 'The internet is down', 'A number is negative'], 'Undefined name — often a typo.'),

      Q('You narrate a line and it doesn\'t match what the program is supposed to do. That means:', 'You\'ve likely found the bug — investigate that line', ['The narration is wrong', 'Nothing — keep going', 'Restart the computer'], 'Intent vs behavior mismatch.'),

    var tabs = [['learn', 'Learn'], ['cards', 'Cards (' + s.cards.length + ')'], ['practice', 'Practice'], ['labs', 'Labs (' + labsDone(s) + '/' + (s.labs || []).length + ')'], ['gate', x.passed ? 'Gate ✓' : 'Gate 🔒']];
    if (!(s.labs || []).length) tabs.splice(3, 1);
    m.innerHTML = '<div class="tag">' + esc((C.tiers.filter(function (t) { return t.id === s.tier; })[0] || {}).name) + ' · ' + stepLabel(s) + ' of ' + inTrack(s.track).length + '</div>' +
      '<h1 style="margin:4px 0 6px">' + esc(s.title) + '</h1><p class="muted" style="margin:0 0 8px">' + esc(s.goal || '') + '</p>' +

      '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (t[0] === tab ? 'on' : '') + '" data-go="#stage/' + s.id + '/' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div><div id="pane"></div>';
    var pane = $('#pane', m);

  }
  function reqChips(s) {
    var x = st(s.id), n = (s.labs || []).length;
    return '<span class="chip ' + (x.lesson ? 'ok' : '') + '">' + (x.lesson ? '✓' : '○') + ' Lesson</span>' +
      (n ? '<span class="chip ' + (labsDone(s) === n ? 'ok' : '') + '">' + (labsDone(s) === n ? '✓' : '○') + ' Labs ' + labsDone(s) + '/' + n + '</span>' : '') +
      '<span class="chip ' + (x.passed ? 'ok' : 'lock') + '">' + (x.passed ? '✓ Gate ' + x.best + '%' : '🔒 Gate >' + PASS + '%' + (x.best ? ' · best ' + x.best + '%' : '')) + '</span>';
  }

  function pLearn(p, s) {
    var x = st(s.id);
    p.innerHTML = '<div class="panel lesson">' + (s.lesson || []).map(function (sec) { return (sec.h ? '<h3>' + esc(sec.h) + '</h3>' : '') + sec.html; }).join('') + '</div>' +
      '<div class="row" style="margin-top:12px">' + (x.lesson ? '<span class="chip ok">✓ Lesson complete</span>' : '<button class="btn pri" id="mark">I read it — mark lesson complete</button>') +
      '<button class="btn" data-go="#stage/' + s.id + '/cards">Drill the cards →</button></div>';
    var b = $('#mark', p); if (b) b.onclick = function () { x.lesson = true; persist(); route(); };
  }

  // ---------- flashcards (Leitner) ----------
  var BOX_DAYS = [0, 1, 2, 4, 8, 16, 30];
  function cardState(c) { return S.cards[c.id] || { box: 0, due: 0 }; }
  function dueCards(list) { var now = Date.now(); return list.filter(function (c) { return cardState(c).due <= now; }); }
  function cardSession(p, list, label) {
    var mode = 'term', deck = shuffle(dueCards(list)), extra = false;
    if (!deck.length) { deck = shuffle(list); extra = true; }
    var i = 0, flipped = false, done = 0;
    function draw() {
      if (i >= deck.length) {
        p.innerHTML = '<div class="panel center"><div class="big">✓</div><h2>Deck cleared</h2><p class="muted">' + done + ' cards reviewed. Cards you marked "Again" come back first next time.</p><button class="btn pri" id="again">Run it again</button></div>';
        $('#again', p).onclick = function () { cardSession(p, list, label); }; return;
      }
      var c = deck[i], cs = cardState(c);
      var front = mode === 'term' ? '<b>' + esc(c.t) + '</b>' : '<div>' + c.d + '</div>';
      var back = mode === 'term' ? '<div>' + c.d + '</div>' : '<b>' + esc(c.t) + '</b>';
      p.innerHTML = '<div class="row small muted"><span>' + esc(label) + ' · ' + (i + 1) + '/' + deck.length + (extra ? ' (extra practice — nothing due)' : '') + '</span><span class="grow"></span>' +
        '<button class="btn sm ghost" id="swap">' + (mode === 'term' ? 'Term → Def' : 'Def → Term') + '</button></div>' +
        '<div class="flash' + (flipped ? ' flip' : '') + '" id="fc"><div class="in"><div class="f">' + front + '<div class="dim small" style="margin-top:12px">tap to flip · box ' + cs.box + '</div></div><div class="b">' + back + '</div></div></div>' +
        '<div class="grade"><button class="btn warn" data-g="0">Again</button><button class="btn" data-g="1">Hard</button><button class="btn pri" data-g="2">Got it</button></div>' +
        '<p class="dim small center" style="margin-top:10px">Laptop: Space flips · 1/2/3 grade</p>';
      $('#fc', p).onclick = function () { flipped = !flipped; this.classList.toggle('flip', flipped); };
      $('#swap', p).onclick = function () { mode = mode === 'term' ? 'def' : 'term'; flipped = false; draw(); };
      p.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { grade(+b.dataset.g); }; });
    }
    function grade(g) {
      var c = deck[i], cs = cardState(c);
      cs.box = g === 0 ? 0 : g === 1 ? Math.max(1, cs.box) : Math.min(6, cs.box + 1);
      cs.due = g === 0 ? Date.now() : Date.now() + BOX_DAYS[cs.box] * 864e5;
      S.cards[c.id] = cs; persist();
      if (g === 0) deck.push(c);
      i++; done++; flipped = false; draw();
    }
    function key(e) {
      if (!p.isConnected) { document.removeEventListener('keydown', key); return; }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); var f = $('#fc', p); if (f) f.click(); }
      if (e.key === '1' || e.key === '2' || e.key === '3') grade(+e.key - 1);
    }
    document.addEventListener('keydown', key);
    cleanup = function () { document.removeEventListener('keydown', key); };
    draw();
  }
  function pCards(p, s) { cardSession(p, s.cards, s.title); }

  // ---------- questions ----------
  function letter(i) { return 'ABCDEFG'.charAt(i); }
  function normAns(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/;$/, ''); }
  function checkInput(q, val) {
    var v = normAns(val);
    return (q.accept || []).some(function (a) {
      if (a instanceof RegExp) return a.test(val.trim());
      return normAns(a) === v;
    });
  }
  function renderQ(q, opts) { // returns html
    var h = '<div class="q">' + (q.html ? q.q : esc(q.q)) + '</div>';
    if (q.input) h += '<input class="answer-in" id="ain" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="' + esc(q.ph || 'Type your answer') + '" enterkeyhint="done">' +
      '<div class="row" style="margin-top:8px"><button class="btn pri" id="asub">Submit</button></div>';
    else h += '<div class="choices">' + q.order.map(function (ci, k) { return '<button class="choice" data-c="' + ci + '"><span class="l">' + letter(k) + '</span><span>' + esc(q.c[ci]) + '</span></button>'; }).join('') + '</div>';
    return h;
  }
  function prep(q) { q = realize(q); var o = { order: q.c ? shuffle(q.c.map(function (_, i) { return i; })) : null }; for (var k in q) o[k] = q[k]; if (q.keep) o.order = q.c.map(function (_, i) { return i; }); return o; }
  function explainHtml(q, ok) {
    var ans = q.input ? (q.show || (q.accept && typeof q.accept[0] === 'string' ? q.accept[0] : '')) : q.c[q.a];
    return '<div class="explain"><b class="v" style="color:' + (ok ? 'var(--ok)' : 'var(--bad)') + '">' + (ok ? 'Correct.' : 'Not quite.') + '</b>' +
      (!ok ? '<div class="small" style="margin-bottom:6px">Answer: <code>' + esc(ans) + '</code></div>' : '') + '<div>' + (q.e || '') + '</div></div>';
  }

  function pPractice(p, s) {
    var pool = s.qs, missedOnly = false;
    var right = 0, total = 0;
    function next() {
      var src = missedOnly ? pool.filter(function (q, i) { return S.missed[s.id + ':' + i]; }) : pool;
      if (!src.length) { p.innerHTML = '<div class="panel">No missed questions here. Nice.</div>'; return; }
      var qi = Math.floor(Math.random() * src.length), raw = src[qi], idx = pool.indexOf(raw), q = prep(raw);
      p.innerHTML = '<div class="row small" style="margin-bottom:8px"><span class="muted">Practice · instant explanations · ' + right + '/' + total + '</span><span class="grow"></span>' +
        '<button class="btn sm ' + (missedOnly ? 'pri' : 'ghost') + '" id="mo">Missed only</button></div><div class="panel" id="qp">' + renderQ(q) + '</div>';
      $('#mo', p).onclick = function () { missedOnly = !missedOnly; next(); };
      wire($('#qp', p), q, function (ok) {
        total++; if (ok) right++;
        if (!q.gen) { if (ok) delete S.missed[s.id + ':' + idx]; else S.missed[s.id + ':' + idx] = 1; persist(); }
        var b = document.createElement('div'); b.className = 'row'; b.style.marginTop = '10px';
        b.innerHTML = '<button class="btn pri" id="nx">Next question</button>'; $('#qp', p).appendChild(b);
        $('#nx', p).onclick = next; $('#nx', p).focus();
      }, true);
    }
    next();
  }
  // wire answering for a rendered question. instant=true shows explanation.
  function wire(box, q, done, instant) {
    var answered = false;
    function finish(ok, picked) {
      if (answered) return; answered = true;
      if (!q.input && instant) box.querySelectorAll('.choice').forEach(function (b) {
        var ci = +b.dataset.c; if (ci === q.a) b.classList.add('right'); else if (ci === picked) b.classList.add('wrong'); b.disabled = true;
      });
      if (instant) box.insertAdjacentHTML('beforeend', explainHtml(q, ok));
      done(ok, picked);
    }
    if (q.input) {
      var inp = $('#ain', box), sub = $('#asub', box);
      sub.onclick = function () { if (!inp.value.trim()) return; inp.disabled = true; sub.disabled = true; finish(checkInput(q, inp.value), inp.value); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') sub.click(); };
      if (document.body.classList.contains('pc')) inp.focus();
    } else box.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { finish(+b.dataset.c === q.a, +b.dataset.c); }; });
  }

  // ---------- gate test ----------
  function pGate(p, s) {
    var x = st(s.id);
    if (!gateReady(s)) {
      p.innerHTML = '<div class="panel"><h2>🔒 Gate locked</h2><p>Before you can test out of this step:</p><ul>' +
        '<li>' + (x.lesson ? '✓' : '○') + ' Read the lesson and mark it complete</li>' +
        ((s.labs || []).length ? '<li>' + (labsDone(s) === s.labs.length ? '✓' : '○') + ' Complete every lab (' + labsDone(s) + '/' + s.labs.length + ')</li>' : '') +
        '</ul><p class="muted">Then score <b>over ' + PASS + '%</b> to unlock the next step and earn your checkpoint phrase.</p></div>';
      return;
    }
    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) {
        var inPool = s.capstone.pool ? s.capstone.pool.indexOf(o.id) >= 0 : (o.idx <= s.idx && o.tier !== 'pro' && o.track === s.track);
        if (inPool) o.qs.forEach(function (q) { if (q.d) pool.push(q); });
      });
      var W = s.capstone.weights || C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;
    function tick() {
      var el = $('#tm', p); if (!el) return;
      var left = limit - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { finish(); return; }
      el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && (cap && cap.domains || C.domains) ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';
      if (cap) tick();
      $('#quit', p).onclick = function () { if (confirm('Abandon this attempt? It counts as an attempt but not a score.')) { st(s.id).attempts++; persist(); if (timerId) clearInterval(timerId); route(); } };
      wire($('#qp', p), q, function (ok, picked) {
        answers.push({ ok: ok, picked: picked });
        if (!q.input) { var b = $('#qp', p).querySelector('[data-c="' + picked + '"]'); if (b) b.classList.add('sel'); }
        setTimeout(function () { i++; show(); }, q.input ? 150 : 220);
      }, false);
    }
    function finish() {
      if (timerId) clearInterval(timerId);
      while (answers.length < set.length) answers.push({ ok: false, picked: null, timeout: true });
      var right = answers.filter(function (a) { return a.ok; }).length, pct = Math.round(1000 * right / set.length) / 10;
      var x = st(s.id), passed = pct > PASS, first = passed && !x.passed;
      x.attempts++; x.best = Math.max(x.best || 0, pct);
      if (passed) x.passed = true;
      S.history.push({ stage: s.id, pct: pct, at: Date.now() });
      if (cap) {
        var byD = {}; set.forEach(function (q, k) { var d = q.d || 0; byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (answers[k].ok) byD[d][0]++; });
      }
      persist(); topbar();
      var next = STAGES.filter(function (o) { return o.prev === s; })[0];
      var h = '<div class="panel center"><div class="tag">' + (passed ? 'PASSED' : 'NOT YET') + '</div><div class="big" style="color:' + (passed ? 'var(--ok)' : 'var(--bad)') + '">' + pct + '%</div>' +
        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';
      else h += '<p class="muted">Review every miss below, drill the cards, and use Practice → Missed only. Then retake — the questions reshuffle.</p>';
      h += '</div>';
      if (cap && byD) h += '<div class="panel" style="margin-top:12px"><h3>By domain</h3>' + Object.keys(byD).map(function (d) { var v = byD[d], pc = Math.round(100 * v[0] / v[1]); return '<div class="row small" style="margin:6px 0"><span style="flex:0 0 52%">' + esc(((cap && cap.domains) || C.domains || {})[d] || 'Other') + '</span><div class="bar grow"><i style="width:' + pc + '%;background:' + (pc > PASS ? 'var(--ok)' : pc >= 75 ? 'var(--lock)' : 'var(--bad)') + '"></i></div><span class="mono">' + pc + '%</span></div>'; }).join('') + '</div>';
      h += '<h3 style="margin-top:18px">Review</h3><div class="stack">';
      set.forEach(function (q, k) {
        var a = answers[k];
        var yours = a.timeout ? '(time ran out)' : q.input ? a.picked : (a.picked != null ? q.c[a.picked] : '');
        if (!a.ok && !q.gen) { var oi = s.qs.indexOf(q); }
        h += '<div class="panel tight"><div class="small muted">Q' + (k + 1) + ' · ' + (a.ok ? '<span style="color:var(--ok)">correct</span>' : '<span style="color:var(--bad)">missed</span>') + '</div><div class="q" style="font-size:.95rem">' + (q.html ? q.q : esc(q.q)) + '</div>' +
          (!a.ok ? '<div class="small">You: <code>' + esc(yours) + '</code></div>' : '') + explainHtml(q, a.ok) + '</div>';
      });
      h += '</div>';
      p.innerHTML = h;
      var cp = $('#cpy', p); if (cp) cp.onclick = function () { copy(s.code); };
      if (first) toast('🔓 ' + (next ? next.title + ' unlocked' : 'Path complete!'), 3000);
    }
    show();
  }

  // ---------- LABS ----------

    $('#all', m).onclick = function () { var p = document.createElement('div'); m.innerHTML = ''; m.appendChild(p); cardSession(p, all, 'All decks'); };

    t.render($('#tool', m), { esc: esc, shuffle: shuffle, toast: toast, gens: C.gens, renderQ: renderQ, wire: wire, prep: prep, setCleanup: function (f) { cleanup = f; } });
  }

  // ---------- SAVE / CODES ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]+/g, ''); }
  function restoreTo(s) {
    STAGES.forEach(function (o) {
      if (o.track === s.track && o.tidx <= s.tidx) { var x = st(o.id); x.lesson = true; (o.labs || []).forEach(function (l) { x.labs[l] = true; }); if (!x.passed) { x.passed = true; x.best = Math.max(x.best || 0, PASS + 1); x.restored = true; } }
    });
    persist();
  }
  function vCodes(m) {
    var earned = STAGES.filter(function (s) { return st(s.id).passed; });
    var hist = S.history.slice(-8).reverse();
    m.innerHTML = '<h1>Save & restore</h1>' +
      '<div class="panel"><h3>Restore from a checkpoint phrase</h3><p class="muted small">Lost your progress or switched devices? Type the phrase from the last step you passed. Every step up to it unlocks.</p>' +
      '<div class="row"><input class="answer-in grow" id="rc" placeholder="e.g. ' + esc(C.codeExample || 'PHRASE-HERE') + '" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="rb">Restore</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Your checkpoint phrases</h3>' +
      (earned.length ? '<div class="list">' + earned.map(function (s) { return '<div class="li" style="cursor:default"><span class="chip ok">' + esc(stepLabel(s).replace('Step ', '')) + '</span><span class="grow"><b>' + esc(s.title) + '</b><div class="mono small" style="color:var(--acc);margin-top:2px">' + esc(s.code) + '</div></span><button class="btn sm" data-cp="' + esc(s.code) + '">Copy</button></div>'; }).join('') + '</div>' +
        '<p class="muted small" style="margin-top:10px">Only your latest phrase in each track matters — it restores everything before it in that track.</p>' : '<p class="muted">Pass your first gate test to earn a phrase.</p>') + '</div>' +
      '<div class="panel" style="margin-top:12px"><h3>Backup file</h3><p class="muted small">Exports everything — card schedules, missed questions, lab configs. Use it to move between iPhone and laptop with full detail.</p>' +
      '<div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Device mode</h3><p class="muted small">Currently: <b>' + (S.device === 'phone' ? 'Phone (lite)' : 'Laptop (full)') + '</b></p><button class="btn" id="dev">Switch device mode</button></div>' +
      (hist.length ? '<div class="panel" style="margin-top:12px"><h3>Recent tests</h3>' + hist.map(function (h) { var s = stageById(h.stage); return '<div class="row small" style="margin:4px 0"><span class="grow">' + esc(s ? s.title : h.stage) + '</span><span class="mono" style="color:' + (h.pct > PASS ? 'var(--ok)' : 'var(--bad)') + '">' + h.pct + '%</span><span class="dim">' + new Date(h.at).toLocaleDateString() + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="panel" style="margin-top:12px"><h3>Danger zone</h3><button class="btn warn" id="rs">Reset all progress</button></div>';
    $('#rb', m).onclick = function () {
      var v = normCode($('#rc', m).value);
      var s = STAGES.filter(function (x) { return normCode(x.code) === v; })[0];
      if (!s) { toast('That phrase does not match any step. Check spelling.'); return; }
      restoreTo(s); S.track = s.track; toast('✓ Restored through ' + esc(stepLabel(s)) + ': ' + esc(s.title), 3000); route();
    };
    m.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copy(b.dataset.cp); }; });
    $('#ex', m).onclick = function () {
      var labs = {}; try { for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key.indexOf(C.id + ':lab:') === 0) labs[key] = localStorage.getItem(key); } } catch (e) { }
      var blob = new Blob([JSON.stringify({ course: C.id, at: Date.now(), state: S, labs: labs })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#im', m).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (d.course !== C.id) { toast('That backup belongs to a different course (' + esc(d.course) + ')'); return; }
          var dev = S.device; S = d.state; S.device = dev; persist();
          Object.keys(d.labs || {}).forEach(function (k) { try { localStorage.setItem(k, d.labs[k]); } catch (e) { } });
          toast('✓ Backup imported'); route();
        } catch (err) { toast('Could not read that file'); }
      };
      r.readAsText(f);
    };
    $('#dev', m).onclick = function () { picker(true); };
    $('#rs', m).onclick = function () {
      if (prompt('Type RESET to wipe all progress on this device') === 'RESET') {
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(C.id + ':') === 0) localStorage.removeItem(k); }); } catch (e) { }
        var dev = S.device; S = { device: dev, stages: {}, cards: {}, missed: {}, history: [], created: Date.now() }; persist(); route();
      }
    };
  }

  // expose for lab plugins / debugging
  window.ENGINE_Q = { prep: prep, renderQ: renderQ, wire: wire };
  window.ENGINE = { state: function () { return S; }, persist: persist, stages: STAGES, st: st, route: route, esc: esc };

  // ---------- boot ----------
  shell();
  if (!S.device) picker(false); else route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();

</script>
</body>
</html>
