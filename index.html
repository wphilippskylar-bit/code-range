<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="Read code effortlessly: Linux, Windows, SQL, Python, JavaScript, C++, Git and AI prompting with real runnable labs.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Code Range">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Code Range</title>
<style>
:root{
  --bg:#0a0e13;--bg2:#0f141b;--panel:#131a23;--panel2:#18212c;--line:#223040;--line2:#2c3d50;
  --text:#dbe4ee;--muted:#8a9bb0;--dim:#5d6f84;
  --acc:#2dd4bf;--acc2:#0ea5a0;--accInk:#032a26;
  --lock:#f5b942;--ok:#3ddc84;--bad:#f2555a;--info:#6aa9ff;
  --r:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
a{color:var(--acc)}
code,kbd,pre,.mono{font-family:var(--mono)}
code{background:#0c1219;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.88em}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:.85rem}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.stack>*+*{margin-top:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* shell */
#top{position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(var(--safeT) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
#top .brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#top .prog{margin-left:auto;font:600 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{height:6px;background:#0c1219;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#main{padding:16px 14px calc(84px + var(--safeB));max-width:1180px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(15,20,27,.96);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safeB))}
#nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--acc)}

/* PC layout */
body.pc #nav{top:0;bottom:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;padding-top:70px;border-top:0;border-right:1px solid var(--line)}
body.pc #nav button{flex:0;padding:12px 4px}
body.pc #top{padding-left:98px}
body.pc #main{padding:24px 28px 40px 112px}

/* cards & panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.tight{padding:12px}
.grid{display:grid;gap:12px}
body.pc .grid.two{grid-template-columns:1fr 1fr}
body.pc .grid.three{grid-template-columns:repeat(3,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px;font-weight:600;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);background:var(--bg2)}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.chip.lock{color:var(--lock);border-color:rgba(245,185,66,.4)}
.chip.acc{color:var(--acc);border-color:rgba(45,212,191,.4)}
.tag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* device picker */
.picker{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 600px at 50% -10%,rgba(45,212,191,.18),transparent),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.picker .box{max-width:560px;width:100%;text-align:center}
.picker .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.picker .opt{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 12px;cursor:pointer;color:var(--text)}
.picker .opt:hover{border-color:var(--acc)}
.picker .opt svg{width:44px;height:44px;color:var(--acc)}
.picker .opt b{display:block;margin-top:8px;font-size:1.05rem}
.picker .opt span{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}

/* path map */
.tier{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.tier h2{margin:0}
.path{position:relative;display:grid;gap:10px}
body.pc .path{grid-template-columns:repeat(2,1fr)}
.node{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.node .num{flex:0 0 40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 14px var(--mono);background:var(--bg2);border:1px solid var(--line2)}
.node.done .num{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.5);color:var(--ok)}
.node.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.node.cur .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.node.locked{opacity:.55;cursor:not-allowed}
.node.locked .num{color:var(--lock)}
.node .t{font-weight:650}
.node .s{font-size:.82rem;color:var(--muted)}

/* stage */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.req{display:flex;gap:8px;flex-wrap:wrap}
.lesson h3{margin-top:1.2em;color:#fff}
.lesson table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--bg2)}
.lesson pre{background:#070b10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.82rem;line-height:1.45}
.lesson ul,.lesson ol{padding-left:1.2em}
.lesson li{margin:.2em 0}
.callout{border-left:3px solid var(--info);background:rgba(106,169,255,.07);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.trap{border-color:var(--bad);background:rgba(242,85,90,.07)}
.callout.pro{border-color:var(--lock);background:rgba(245,185,66,.07)}
.callout b.k{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.callout.trap b.k{color:var(--bad)}.callout.pro b.k{color:var(--lock)}.callout b.k{color:var(--info)}

/* flashcards */
.flash{perspective:1200px;height:240px;cursor:pointer;margin:6px 0 12px}
body.pc .flash{height:280px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel);overflow:auto}
.flash .f b{font-size:1.4rem}
.flash .b{transform:rotateY(180deg);background:var(--panel2);font-size:1rem}
body.lite .flash .in{transition:none}
body.lite .flash .f,body.lite .flash .b{backface-visibility:visible;-webkit-backface-visibility:visible}
body.lite .flash .b{transform:none;display:none}
body.lite .flash.flip .in{transform:none}
body.lite .flash.flip .f{display:none}
body.lite .flash.flip .b{display:flex}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* quiz */
.q{font-size:1.05rem;font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;cursor:pointer;color:var(--text)}
.choice .l{font:700 12px var(--mono);color:var(--muted);flex:0 0 18px;padding-top:2px}
.choice.sel{border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:rgba(61,220,132,.09)}
.choice.wrong{border-color:var(--bad);background:rgba(242,85,90,.09)}
.explain{margin-top:12px;padding:12px;border-radius:10px;background:#0c1219;border:1px solid var(--line)}
.explain b.v{display:block;margin-bottom:4px}
.answer-in{width:100%;background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-family:var(--mono)}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font:600 12px var(--mono);margin-bottom:8px}
.timer{font:700 14px var(--mono);color:var(--lock)}

/* lab */
.lab{display:grid;gap:12px}
body.pc .lab{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
body.pc .lab .termwrap{position:sticky;top:70px}
.topo{width:100%;height:auto;background:radial-gradient(circle at 50% 40%,#101823,#0b1017);border:1px solid var(--line);border-radius:var(--r);touch-action:manipulation}
.topo .dev{cursor:pointer}
.topo .dev text{fill:var(--text);font:600 11px var(--sans)}
.topo .dev.sel rect.hit,.topo .dev.sel circle.hit{stroke:var(--acc);stroke-width:2.5}
.topo .lk{stroke-width:2.5}
.topo .lk.up{stroke:var(--ok)}.topo .lk.down{stroke:var(--bad);stroke-dasharray:6 5}
.topo .pl{fill:var(--muted);font:500 9px var(--mono)}
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tasks li:last-child{border-bottom:0}
.tasks .ck{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px}
.tasks li.ok .ck{background:var(--ok);border-color:var(--ok);color:#03210f}
.tasks li.ok span{color:var(--muted)}
.term{background:#05080c;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.term .bar2{display:flex;gap:6px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);background:#0a0f15;scrollbar-width:none}
.term .bar2::-webkit-scrollbar{display:none}
.term .bar2 button{flex:0 0 auto;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font:600 12px var(--mono);cursor:pointer}
.term .bar2 button.on{color:var(--acc);border-color:var(--acc)}
.term .out{font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;padding:10px 12px;height:340px;overflow-y:auto;color:#c9d6e3}
body.pc .term .out{height:440px}
.term .out .cmd{color:var(--acc)}
.term .out .hint{color:var(--lock)}
.term .inl{display:flex;align-items:center;border-top:1px solid var(--line);padding:6px 10px;gap:6px;background:#070b10}
.term .inl .pr{font:600 12.5px var(--mono);color:var(--acc);white-space:nowrap}
.term .inl input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--mono);color:#fff;padding:6px 0}
.keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 8px;background:#070b10;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;font:600 12px var(--mono);cursor:pointer}
body.pc .keys{display:none}

/* code / checkpoint */
.code{font:700 1.25rem var(--mono);letter-spacing:.06em;color:var(--acc);background:#06100f;border:1px dashed var(--acc2);border-radius:12px;padding:14px;text-align:center;word-break:break-all;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc2);padding:10px 16px;border-radius:12px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,7,10,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.big{font-size:2.6rem;font-weight:800;font-family:var(--mono)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--text);text-align:left;width:100%}
.li .grow .s{font-size:.82rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:13px var(--mono)}
.kv b{color:var(--muted);font-weight:500}

/* lite (phone) mode: cut the expensive stuff */
body.lite #top,body.lite #nav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}
body.lite *{transition:none!important;animation:none!important}
body.lite .node.cur,body.lite .toast{box-shadow:none}
body.lite #top .brand .dot{box-shadow:none}
body.lite .picker{background:var(--bg)}
body.lite .topo{background:#0b1017}
@media (max-width:420px){.term .out{height:300px}h1{font-size:1.3rem}}
.lab>*,.stack,.termwrap,.term,#main{min-width:0}
html,body{overflow-x:hidden}
.tabs.trk button{font-size:.95rem;padding:9px 16px}
/* cloud resource map */
.rmap{max-height:none}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--bg2)}
.rs{border-left:2px solid var(--line2);margin:6px 0 2px 4px;padding-left:10px}
.rh{margin:2px 0;line-height:1.6}
.ri{margin:3px 0;line-height:1.6;word-break:break-word}
.rv code{font-size:.78em}
.rb{display:inline-block;font:600 10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid}
.rb.ok{color:var(--ok);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.08)}
.rb.no{color:var(--bad);border-color:rgba(242,85,90,.45);background:rgba(242,85,90,.08)}

/* code editor */
.editor{width:100%;min-height:200px;background:#05080c;color:#d6e2f0;border:0;border-bottom:1px solid var(--line);
  font:13px/1.5 var(--mono);padding:12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;outline:none}
body.pc .editor{min-height:300px}
.keys.show{display:flex}
.term .out .cmd{color:var(--acc)}
.rb{font-family:var(--mono)}

:root{--acc:#a78bfa;--acc2:#8b5cf6;--accInk:#1a0b3a}

</style>
</head>
<body>
<noscript>This study app needs JavaScript enabled.</noscript>
<script>
/* build fa91a5d14e */
/* ShSim — Linux bash learning simulator. A virtual filesystem for practicing commands:
   navigation, pipes, redirection, variables, globs, text tools (grep/sed/awk/cut/sort/uniq/wc/head/tail/tr),
   find, permissions (chmod/chown read as octal/symbolic), and small shell scripts (for/if/while/args).
   This is a teaching sandbox with ordinary sample data — not a model of a real machine. */
(function (root) {
  'use strict';
  function D(children, mode) { return { t: 'd', c: children || {}, mode: mode || 'rwxr-xr-x' }; }
  function F(content, mode) { return { t: 'f', d: content == null ? '' : content, mode: mode || 'rw-r--r--' }; }

  var SALES = 'date,region,product,units,price\n2026-01-03,West,Keyboard,12,29.99\n2026-01-03,East,Mouse,30,14.50\n2026-01-04,West,Monitor,5,199.00\n2026-01-04,North,Keyboard,8,29.99\n2026-01-05,East,Monitor,3,199.00\n2026-01-05,West,Mouse,22,14.50\n2026-01-06,North,Cable,50,4.25\n2026-01-06,East,Keyboard,15,29.99\n';
  var POEM = 'the garden grows in quiet rows\nrow upon row of green\nthe gardener knows what the garden knows\nand tends the space between\n';
  var SERVERS = 'web01 up 42\nweb02 up 17\ndb01 up 120\ncache01 down 0\nweb03 up 8\ndb02 up 95\n';

  function homeFiles(extra) {
    var h = {
      'welcome.txt': F('Welcome to the Linux Range.\nEverything here is a safe practice sandbox.\nType help for a command list, or ls to look around.\n'),
      'notes.md': F('# Study notes\n- linux paths are case-sensitive\n- pwd prints where you are\n- man pages explain any command\n- pipes send one command\'s output into the next\n'),
      'sales.csv': F(SALES),
      'poem.txt': F(POEM),
      'servers.txt': F(SERVERS),
      'projects': D({ 'app.py': F('print("hello")\n'), 'app.js': F('console.log("hi")\n'), 'README.md': F('# My project\n'), 'old.log': F('debug line 1\nERROR disk full\ndebug line 2\nERROR timeout\n') }),
      'Documents': D({ 'resume.txt': F('Phil — IT and Cybersecurity\n'), 'budget.csv': F('item,cost\nrent,1200\nfood,400\n') }),
      'Downloads': D({}),
      '.bashrc': F('# ~/.bashrc\nexport GREETING="hello"\nalias ll="ls -la"\nalias ..="cd .."\n')
    };
    Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  function baseFS(extra) {
    return D({
      home: D({ phil: D(homeFiles(extra), 'rwxr-xr-x') }),
      etc: D({ 'hostname': F('range01\n'), 'os-release': F('NAME="Ubuntu"\nVERSION="24.04 LTS"\nID=ubuntu\n'), 'hosts': F('127.0.0.1 localhost\n'), 'timezone': F('America/Chicago\n') }),
      var: D({ log: D({ 'app.log': F('INFO  08:00 service started\nWARN  08:01 cache miss\nERROR 08:02 connection refused\nINFO  08:03 retrying\nERROR 08:04 connection refused\nINFO  08:05 connected\n') }) }),
      tmp: D({}),
      usr: D({ bin: D({}), share: D({}) }),
      bin: D({})
    });
  }

  // ---------- path + node helpers ----------
  function Shell(fs, opts) {
    opts = opts || {};
    this.fs = fs || baseFS(opts.extraHome);
    this.cwd = opts.cwd || '/home/phil';
    this.env = { HOME: '/home/phil', USER: 'phil', PWD: this.cwd, SHELL: '/bin/bash', PATH: '/usr/bin:/bin', HOSTNAME: 'range01', GREETING: 'hello', '?': '0' };
    this.aliases = { ll: 'ls -la', '..': 'cd ..' };
    this.history = [];
  }
  Shell.prototype.norm = function (p) {
    if (!p) p = this.cwd;
    if (p[0] === '~') p = this.env.HOME + p.slice(1);
    if (p[0] !== '/') p = this.cwd + '/' + p;
    var parts = p.split('/'), out = [];
    parts.forEach(function (s) { if (s === '' || s === '.') return; if (s === '..') out.pop(); else out.push(s); });
    return '/' + out.join('/');
  };

    hints: ['GROUP BY product, aggregate with SUM(qty).', 'Filter groups with HAVING SUM(qty) >= 3 (not WHERE).', 'ORDER BY the alias DESC.'],
    debrief: 'GROUP BY + HAVING is how you turn raw rows into summaries and then filter those summaries.' });
  slab({ id: 'sq-join', title: 'Join two tables', brief: 'Return each customer <b>name</b> alongside each <b>product</b> they ordered. Join <code>orders</code> to <code>customers</code> on the customer key. Sort by name, then product.', starter: 'SELECT ...', ordered: true,
    solution: "SELECT c.name, o.product FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY c.name, o.product;",
    mustUse: ['JOIN'],
    hints: ['FROM orders o JOIN customers c ON o.customer_id = c.id', 'SELECT c.name, o.product.', 'ORDER BY c.name, o.product.'],
    debrief: 'JOIN ... ON a key is how normalized data gets stitched back together. This is the single most important SQL skill.' });
  slab({ id: 'sq-cte', title: 'Rank customers by spend', brief: 'Using a <b>CTE</b>, compute total spend (SUM of qty×price) per customer, then return customer <b>name</b> and <b>total</b> (highest spender first).', starter: 'WITH spend AS (\n  ...\n)\nSELECT ...', ordered: true,
    solution: "WITH spend AS (SELECT customer_id, SUM(qty*price) AS total FROM orders GROUP BY customer_id) SELECT c.name, spend.total FROM spend JOIN customers c ON c.id = spend.customer_id ORDER BY spend.total DESC;",
    mustUse: ['WITH'],
    hints: ['CTE: WITH spend AS (SELECT customer_id, SUM(qty*price) AS total FROM orders GROUP BY customer_id).', 'Main query joins spend to customers for the name.', 'ORDER BY spend.total DESC.'],
    debrief: 'The CTE named the hard part; the main query stayed clean. This is how real analysts write SQL.' });
  slab({ id: 'sq-window', title: 'Rank with a window function', brief: 'Return <b>product</b>, <b>price</b>, and a <b>rank</b> column numbering orders from most to least expensive by price, using <code>ROW_NUMBER()</code>. (One row per order in the orders table.)', starter: 'SELECT ...', ordered: true,
    solution: "SELECT product, price, ROW_NUMBER() OVER (ORDER BY price DESC) AS rank FROM orders ORDER BY rank;",
    mustUse: ['OVER\\s*\\('],
    hints: ['ROW_NUMBER() OVER (ORDER BY price DESC) AS rank.', 'Keep all order rows — no GROUP BY.', 'ORDER BY rank to present them in order.'],
    debrief: 'Window functions rank and total without collapsing rows. "Top N", running totals and "vs average" all come from here.' });

(function () {

    id: 'git1', track: 'git', tier: 'git-f', title: 'The three areas: add, commit, log', code: 'git commit -m "init"',

      { h: 'What Git is', html: '<p>Git is a <b>version control system</b>: it records snapshots of your project over time so you can see history, undo mistakes, and collaborate. Every developer lives in it daily.</p>' },
      { h: 'The three areas', html: '<pre>Working directory  →  Staging area (index)  →  Repository (commits)\n   (your edits)         git add               git commit</pre><ul><li><b>Working directory</b> — your actual files as you edit them.</li><li><b>Staging area</b> — a snapshot you\'re <i>about</i> to commit. <code>git add</code> moves changes here.</li><li><b>Repository</b> — the permanent history. <code>git commit</code> records the staged snapshot as a new commit.</li></ul><div class="callout pro"><b class="k">Why staging exists</b>You can craft a commit from exactly the changes you want — not everything you touched. Pros commit small, logical units, not "stuff".</div>' },
      { h: 'The core loop', html: '<pre>git init                       # start tracking this folder (once)\ngit config user.name "Phil"    # identify yourself (once)\ngit config user.email "p@x.com"\n\ngit status                     # what changed? (run this constantly)\ngit add file.txt               # stage a file   (git add . = everything)\ngit commit -m "Add feature"    # record a snapshot with a message\ngit log --oneline              # view history</pre>' },
      { h: 'Reading status & undoing', html: '<ul><li><code>git status</code> — the command you run most. Shows staged, modified and untracked files.</li><li><code>git diff</code> — unstaged changes; <code>git diff --staged</code> — staged changes.</li><li><code>git restore file</code> — discard working changes; <code>git restore --staged file</code> — unstage.</li><li>Good commit messages: imperative and specific — "Add login validation", not "stuff".</li></ul>' }

      Q('git add . does what?', 'Stages all changes in the current directory', ['Commits everything', 'Creates a repo', 'Deletes files'], 'Stage all.', 0),

  S.push({
    id: 'git2', track: 'git', tier: 'git-c', title: 'Branches, merges & remotes', code: 'git checkout -b feature',
    goal: 'Work in parallel with branches, combine work with merges, resolve conflicts, and sync with a remote.',
    lesson: [
      { h: 'Branches', html: '<p>A <b>branch</b> is a movable pointer to a line of work. You branch off to build a feature without disturbing <code>main</code>, then merge it back.</p><pre>git branch                 # list branches (* = current)\ngit switch -c feature      # create AND switch (older: git checkout -b)\n# ...edit, add, commit on feature...\ngit switch main            # back to main\ngit merge feature          # bring feature\'s commits into main</pre>' },
      { h: 'Fast-forward vs merge commit', html: '<ul><li>If main hasn\'t moved since you branched, Git just slides the pointer forward — a <b>fast-forward</b>.</li><li>If both moved, Git makes a <b>merge commit</b> that joins the two histories.</li></ul>' },
      { h: 'Conflicts', html: '<p>When two branches changed the <b>same lines</b>, Git can\'t decide and marks a <b>conflict</b>:</p><pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nyour version\n=======\ntheir version\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</pre><p>You edit the file to the correct final content (removing the markers), <code>git add</code> it, and <code>git commit</code> to complete the merge. Conflicts are normal — not errors.</p>' },
      { h: 'Remotes: push & pull', html: '<pre>git remote add origin https://github.com/you/repo.git\ngit push -u origin main     # upload commits (set upstream the first time)\ngit pull                    # fetch + merge others\' commits\ngit clone <url>             # copy a repo locally</pre><div class="callout pro"><b class="k">Everyday flow</b>pull → branch → edit → add → commit → push → open a pull request. Commit small and often; push when a logical chunk is done.</div>' },
      { h: 'Undo toolkit', html: '<ul><li><code>git restore file</code> — discard working changes.</li><li><code>git reset --soft HEAD~1</code> — undo last commit, keep changes staged; <code>--hard</code> — discard them (careful).</li><li><code>git revert &lt;commit&gt;</code> — a new commit that undoes an old one (safe for shared history).</li><li><code>git stash</code> — shelve changes temporarily; <code>git stash pop</code> to bring them back.</li></ul>' }

      ['Merge conflict', 'Same lines changed on both branches; you resolve manually.'], ['Conflict markers', '<<<<<<< ======= >>>>>>> around the two versions.'], ['git remote add origin', 'Register a remote repository URL.'], ['git push -u origin main', 'Upload commits and set the upstream.'], ['git pull', 'Fetch and merge remote changes.'], ['git clone', 'Copy a remote repository locally.'],
      ['git revert', 'Create a new commit that undoes a past commit (safe).'], ['git reset --hard', 'Move the branch and discard changes (dangerous).'], ['git stash', 'Temporarily shelve uncommitted changes.'], ['HEAD', 'Pointer to your current commit/branch.']
    ],
    qs: [

/* Windows track — CMD + PowerShell (concept + read-the-command, no sandbox) */
(function () {

    id: 'win1', track: 'win', tier: 'win-f', title: 'The Command Prompt (CMD)', code: 'dir /s *.log',

    lesson: [
      { h: 'CMD basics', html: '<p>Open with <b>cmd.exe</b>. The prompt shows the current path: <code>C:\\Users\\Phil&gt;</code>. Windows paths use <b>backslashes</b> and <b>drive letters</b> (<code>C:</code>), and are <b>case-insensitive</b>.</p>' },
      { h: 'Core commands (and their Linux cousins)', html: '<table><tr><th>CMD</th><th>Does</th><th>Linux</th></tr><tr><td><code>cd</code></td><td>Change directory (<code>cd ..</code> up)</td><td>cd</td></tr><tr><td><code>cd</code> (alone)</td><td>Print current dir</td><td>pwd</td></tr><tr><td><code>dir</code></td><td>List files</td><td>ls</td></tr><tr><td><code>type file</code></td><td>Print a file</td><td>cat</td></tr><tr><td><code>copy</code> / <code>move</code></td><td>Copy / move</td><td>cp / mv</td></tr><tr><td><code>del</code> / <code>erase</code></td><td>Delete a file</td><td>rm</td></tr><tr><td><code>md</code> / <code>mkdir</code></td><td>Make directory</td><td>mkdir</td></tr><tr><td><code>rd</code> / <code>rmdir</code></td><td>Remove directory</td><td>rmdir</td></tr><tr><td><code>cls</code></td><td>Clear screen</td><td>clear</td></tr><tr><td><code>findstr</code></td><td>Search text in files</td><td>grep</td></tr><tr><td><code>where</code></td><td>Locate a program</td><td>which</td></tr></table>' },
      { h: 'Flags, wildcards, pipes', html: '<ul><li>Options use a <b>slash</b>: <code>dir /s</code> (recurse subfolders), <code>dir /a</code> (show hidden), <code>del /q</code> (quiet).</li><li>Wildcards <code>*</code> and <code>?</code> work: <code>dir *.txt</code>, <code>del temp?.log</code>.</li><li>Pipes <code>|</code> and redirection <code>&gt; &gt;&gt;</code> work like Linux: <code>dir | findstr .log</code>, <code>ipconfig &gt; net.txt</code>.</li><li>Variables use <b>percent signs</b>: <code>%USERNAME%</code>, <code>%PATH%</code>, <code>%CD%</code>. Set one with <code>set NAME=value</code>.</li></ul>' },
      { h: 'Useful system commands', html: '<ul><li><code>ipconfig</code> (network — like <code>ip addr</code>), <code>ping</code>, <code>tracert</code> (Linux traceroute), <code>nslookup</code>.</li><li><code>tasklist</code> / <code>taskkill /PID n</code> (processes), <code>systeminfo</code>, <code>hostname</code>, <code>whoami</code>.</li><li><code>sfc /scannow</code>, <code>chkdsk</code> (repair). Run as administrator for system changes.</li></ul>' }
    ],
    cards: [
      ['dir', 'List files (Linux ls). /s recurse, /a show hidden.'], ['cd', 'Change directory; cd alone prints the current path.'], ['type file', 'Print a file (Linux cat).'], ['copy / move', 'Copy / move files (cp / mv).'], ['del / erase', 'Delete a file (rm).'], ['md / rd', 'Make / remove directory.'], ['cls', 'Clear the screen (clear).'],
      ['findstr', 'Search for text (grep). findstr ERROR app.log.'], ['where', 'Locate a program (which).'], ['Windows paths', 'Backslashes and drive letters: C:\\Users\\Phil. Case-insensitive.'], ['Flags use /', 'dir /s, del /q.'], ['%VAR%', 'Environment variable in CMD: %USERNAME%, %PATH%.'], ['set NAME=val', 'Set a CMD variable.'], ['ipconfig', 'Show network configuration (Linux ip addr).'], ['tasklist / taskkill', 'List / kill processes.']

    qs: [
      Q('Which CMD command lists files in a directory?', 'dir', ['ls', 'list', 'show'], 'dir is the Windows ls.', 0),

      Q('Windows file paths use which separator?', 'Backslash \\', ['Forward slash /', 'Colon :', 'Pipe |'], 'C:\\Users\\Phil.', 0),

    ],

  });

  S.push({
    id: 'win2', track: 'win', tier: 'win-c', title: 'PowerShell: objects & the pipeline', code: 'Get-Process | Sort CPU',
    goal: 'The modern Windows shell — where the pipeline carries objects, not text.',
    lesson: [
      { h: 'Why PowerShell is different', html: '<p>In bash and CMD, pipes carry <b>text</b>. In PowerShell, pipes carry <b>objects</b> with real properties. That means no fragile text parsing — you filter and sort by actual fields.</p>' },
      { h: 'Cmdlets: Verb-Noun', html: '<p>Commands are named <b>Verb-Noun</b>: <code>Get-ChildItem</code>, <code>Get-Process</code>, <code>Set-Location</code>, <code>Copy-Item</code>, <code>Remove-Item</code>. Common aliases make them feel familiar: <code>ls</code>/<code>dir</code>→Get-ChildItem, <code>cd</code>→Set-Location, <code>cat</code>→Get-Content, <code>cp</code>→Copy-Item, <code>rm</code>→Remove-Item, <code>pwd</code>→Get-Location.</p>' },
      { h: 'The object pipeline', html: '<pre># top 5 processes by memory\nGet-Process | Sort-Object WorkingSet -Descending | Select-Object -First 5\n\n# only running services\nGet-Service | Where-Object { $_.Status -eq "Running" }\n\n# files over 1MB, just name and size\nGet-ChildItem | Where-Object { $_.Length -gt 1MB } | Select-Object Name, Length</pre><ul><li><code>Where-Object { $_.Field -op value }</code> filters (like SQL WHERE / bash grep). <code>$_</code> is the current object.</li><li>Operators are words: <code>-eq -ne -gt -lt -ge -le -like -match</code>.</li><li><code>Select-Object</code> picks properties; <code>Sort-Object</code> sorts; <code>Measure-Object</code> aggregates.</li></ul>' },
      { h: 'Variables, loops & scripts', html: '<pre>$name = "Phil"\nWrite-Output "Hi $name"           # "..." expands $name\n$files = Get-ChildItem *.log\nforeach ($f in $files) { Write-Output $f.Name }\n\nif ($count -gt 10) { ... } else { ... }</pre><p>Variables start with <code>$</code>. Scripts are <code>.ps1</code> files. (Execution policy may need <code>Set-ExecutionPolicy</code> to run them.) <code>Get-Help &lt;cmdlet&gt;</code> and <code>Get-Member</code> (to see an object\'s properties) are your reference.</p>' }
    ],
    cards: [
      ['PowerShell pipeline', 'Carries objects with properties, not plain text.'], ['Verb-Noun', 'Cmdlet naming: Get-Process, Set-Location, Remove-Item.'], ['Get-ChildItem', 'List items (alias ls/dir).'], ['Get-Content', 'Read a file (alias cat).'], ['Where-Object { }', 'Filter objects. $_ is the current object.'], ['$_', 'The current pipeline object.'],
      ['-eq -gt -like', 'Comparison operators are words, not symbols.'], ['Select-Object', 'Pick properties or first/last N.'], ['Sort-Object', 'Sort by a property.'], ['Measure-Object', 'Count/sum/average a property.'], ['$var', 'Variables start with a dollar sign.'], ['Write-Output', 'Print (also Write-Host).'], ['.ps1', 'A PowerShell script file.'], ['Get-Member', 'Discover an object\'s properties and methods.']
    ],
    qs: [
      Q('What does a PowerShell pipeline carry between commands?', 'Objects with properties', ['Plain text', 'File handles', 'Bytes only'], 'Objects, not text.', 0),
      Q('PowerShell cmdlets are named:', 'Verb-Noun (Get-Process)', ['noun.verb()', 'all lowercase', 'VERB_NOUN'], 'Verb-Noun.', 0),
      Q('Filter to only running services. Which cmdlet?', 'Where-Object { $_.Status -eq "Running" }', ['Select-Object Running', 'grep Running', 'Filter Running'], 'Where-Object with $_.', 0),
      Q('In Where-Object, what does $_ mean?', 'The current object in the pipeline', ['The whole collection', 'The previous command', 'A wildcard'], '$_ = current item.', 0),
      Q('Equality comparison in PowerShell is:', '-eq', ['==', '=', '.equals'], 'Word operators: -eq.', 0),
      Q('Pick just the Name and Length properties.', 'Select-Object Name, Length', ['cut -f Name', 'Get Name Length', 'Pick Name Length'], 'Select-Object.', 0),
      Q('List files (what is Get-ChildItem aliased to)?', 'ls and dir', ['only gci', 'cat', 'find'], 'ls/dir/gci all work.', 0),
      Q('Variables in PowerShell start with:', '$', ['%', '@', 'var'], '$name.', 0),
      Q('Read a file\'s contents in PowerShell.', 'Get-Content file.txt', ['type file.txt only', 'Read-File', 'Open-Item'], 'Get-Content (alias cat).', 0),
      Q('Discover what properties an object has.', 'Get-Member', ['Get-Help', 'Get-Props', 'Describe-Object'], 'Get-Member.', 0),
      Q('Why is the object pipeline better than text pipes for scripting?', 'You filter/sort by real fields instead of parsing fragile text', ['It is always faster', 'It uses less memory', 'It needs no cmdlets'], 'No text parsing.', 0),
      Q('Sort processes by CPU descending, take top 3.', 'Get-Process | Sort-Object CPU -Descending | Select-Object -First 3', ['Get-Process | top 3', 'ps | sort CPU | head', 'Get-Process /sort'], 'Sort-Object then Select -First.', 0),

/* C++ track */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, P = window.PRED, L = COURSE.labs;

  S.push({
    id: 'cpp1', track: 'cpp', tier: 'cpp-f', title: 'Types, I/O & control flow', code: 'int main() { return 0; }',
    goal: 'The structure of a C++ program, strong typing, input/output, and functions.',
    lesson: [
      { h: 'Anatomy of a program', html: '<pre>#include &lt;iostream&gt;   // bring in input/output\nusing namespace std; // so we can write cout, not std::cout\n\nint main() {         // execution starts here\n    cout &lt;&lt; "Hello" &lt;&lt; endl;   // print, then newline\n    return 0;        // 0 = success\n}</pre><p>Every statement ends with <code>;</code>. Blocks use <code>{ }</code>. <code>main</code> returns an <code>int</code> exit code.</p>' },
      { h: 'Static typing', html: '<p>Unlike Python/JS, you declare a type and it can\'t change. The compiler checks types before the program runs.</p><pre>int age = 27;        // whole number\ndouble price = 9.99; // floating point\nchar grade = \'A\';    // single character (single quotes)\nbool ok = true;\nstring name = "Phil";  // #include &lt;string&gt;\nconst int MAX = 100;   // can\'t change</pre><div class="callout trap"><b class="k">Integer division</b><code>7 / 2</code> is <code>3</code> (both ints → integer division). For <code>3.5</code> make one a double: <code>7.0 / 2</code>. And <code>\'A\'</code> uses single quotes; <code>"A"</code> is a string.</div>' },
      { h: 'Input and output', html: '<pre>int x;\ncin &gt;&gt; x;              // read an int from input\nstring word;\ncin &gt;&gt; word;           // read one whitespace-delimited word\ncout &lt;&lt; "x is " &lt;&lt; x &lt;&lt; endl;</pre><p><code>&lt;&lt;</code> sends to output (chainable); <code>&gt;&gt;</code> reads from input.</p>' },
      { h: 'Control flow & functions', html: '<pre>if (score &gt;= 90) { cout &lt;&lt; "A"; }\nelse if (score &gt;= 80) { cout &lt;&lt; "B"; }\nelse { cout &lt;&lt; "C"; }\n\nfor (int i = 0; i &lt; 5; i++) cout &lt;&lt; i;      // 01234\n\nint n = 3;\nwhile (n &gt; 0) { cout &lt;&lt; n; n--; }           // 321\n\nint add(int a, int b) {   // return type comes first\n    return a + b;\n}</pre><p>Functions declare their return type and each parameter\'s type. <code>void</code> means "returns nothing".</p>' }
    ],
    cards: [
      ['#include <iostream>', 'Bring in input/output facilities.'], ['int main()', 'Program entry point; returns an exit code.'], ['cout <<', 'Send values to standard output (chainable).'], ['cin >>', 'Read a value from standard input.'], ['endl / "\\n"', 'End the line.'], ['Static typing', 'Every variable has a fixed type checked at compile time.'],
      ['int / double / char / bool', 'Integer / decimal / single character / true-false.'], ['string', 'Text type (#include <string>).'], ['const', 'A value that cannot change.'], ['Integer division', '7 / 2 == 3 when both are ints.'], ['Single vs double quotes', "'A' is a char; \"A\" is a string."],
      ['if/else if/else', 'Conditional branching with { } blocks.'], ['for (int i=0;i<n;i++)', 'Classic counting loop.'], ['Function signature', 'returnType name(type param, ...).'], ['void', 'Function returns nothing.'], ['; and { }', 'Statements end with ;, blocks use braces.']
    ],
    qs: [
      P('#include <iostream>\nusing namespace std;\nint main(){ cout << 7 / 2; }', '3', ['3.5', '4', '2'], 'Integer division truncates.', 'C++'),
      P('cout << 7.0 / 2;', '3.5', ['3', '4', '3.0'], 'One double → floating point division.', 'C++'),
      P('int x = 5;\ncout << x * x;', '25', ['10', '55', 'x*x'], '5 squared.', 'C++'),
      P('for (int i = 1; i <= 3; i++) cout << i;', '123', ['1 2 3', '0123', '321'], 'Prints 1,2,3 with no spaces.', 'C++'),
      P('int n = 3;\nwhile (n > 0) { cout << n; n--; }', '321', ['123', '3210', '3'], 'Counts down.', 'C++'),
      Q('Which is a single character literal?', "'A'", ['"A"', '`A`', 'char(A)'], "Single quotes = char.", 0),
      Q('main returns 0 to mean:', 'The program succeeded', ['An error', 'Infinity', 'Nothing'], '0 = success exit code.', 0),
      Q('How do you read an integer from input?', 'cin >> x;', ['input(x);', 'x = read();', 'cin << x;'], '>> reads; << writes.', 0),
      Q('What does static typing mean?', 'Variable types are fixed and checked at compile time', ['Types can change anytime', 'There are no types', 'Everything is a string'], 'Compile-time type checking.', 0),
      P('int a = 10, b = 3;\ncout << a % b;', '1', ['3', '0', '3.33'], '10 mod 3 = 1.', 'C++'),
      Q('A function that returns nothing has return type:', 'void', ['null', 'none', 'int'], 'void.', 0),
      Q('Every simple statement in C++ ends with:', 'A semicolon ;', ['A newline', 'A period', 'A brace'], 'Semicolons.', 0),
      P('bool ok = (5 > 3);\ncout << ok;', '1', ['true', 'yes', '0'], 'cout prints bool as 1/0.', 'C++'),
      T('Write the function signature line for int add(a, b) taking two ints.', [/int add\(int a,\s*int b\)/], 'int add(int a, int b)', 0, 'int add(...)')

  S.push({
    id: 'cpp2', track: 'cpp', tier: 'cpp-c', title: 'Memory, pointers, references & objects', code: 'int* p = &x;',
    goal: 'What makes C++ powerful and feared: pointers, references, vectors, and classes.',
    lesson: [
      { h: 'The stack and memory', html: '<p>Local variables live on the <b>stack</b> and vanish when the function returns. You can also ask for memory on the <b>heap</b> (<code>new</code>/<code>delete</code>) that you manage yourself. Every variable has an <b>address</b> in memory.</p>' },
      { h: 'Pointers & references', html: '<pre>int x = 42;\nint* p = &x;    // p holds the ADDRESS of x (& = "address of")\ncout << *p;     // 42   (* = "value at" — dereference)\n*p = 99;        // changes x through the pointer → x is now 99\n\nint& r = x;     // reference: another name for x\nr = 7;          // x is now 7</pre><ul><li><code>&x</code> = address of x; <code>*p</code> = the value p points to.</li><li>A <b>reference</b> (<code>int&amp;</code>) is an alias — commonly used to pass variables to functions so the function can modify them (pass by reference) and to avoid copying big objects.</li></ul><div class="callout trap"><b class="k">The classic bugs</b>A pointer that points nowhere valid (dangling/null) crashes with a segfault. Memory from <code>new</code> that is never <code>delete</code>d is a <b>memory leak</b>. Modern C++ prefers <b>smart pointers</b> (<code>unique_ptr</code>, <code>shared_ptr</code>) and containers so you rarely manage raw memory by hand.</div>' },
      { h: 'Vectors (the array you want)', html: '<pre>#include &lt;vector&gt;\nvector&lt;int&gt; v = {3, 1, 4};\nv.push_back(9);     // add to end\nv[0];               // 3\nv.size();           // 4\nfor (int n : v) cout &lt;&lt; n;   // range-based for\nsort(v.begin(), v.end());    // #include &lt;algorithm&gt;</pre><p><code>vector</code> is a dynamic array that grows automatically — use it instead of raw C arrays.</p>' },
      { h: 'Classes & objects', html: '<pre>class Counter {\nprivate:\n    int count = 0;        // hidden from outside\npublic:\n    void increment() { count++; }   // method\n    int get() const { return count; }\n};\n\nCounter c;\nc.increment();\ncout &lt;&lt; c.get();   // 1</pre><ul><li><code>public</code> members are the interface; <code>private</code> hides internal state (<b>encapsulation</b>).</li><li>A <b>constructor</b> (named like the class) initializes a new object; a <b>destructor</b> (<code>~Class()</code>) cleans up.</li><li>Pass big objects by <code>const</code> reference (<code>const string&amp; s</code>) to avoid copies.</li></ul>' }
    ],
    cards: [
      ['&x', 'Address-of: the memory address of x.'], ['int* p', 'A pointer — holds an address.'], ['*p', 'Dereference: the value the pointer points to.'], ['int& r = x', 'A reference: an alias for another variable.'], ['Pass by reference', 'Let a function modify the caller\'s variable / avoid copying.'],
      ['Stack vs heap', 'Automatic local memory vs manually managed (new/delete) memory.'], ['Memory leak', 'Heap memory from new that is never delete-d.'], ['Dangling/null pointer', 'Points to invalid memory → crash (segfault).'], ['Smart pointer', 'unique_ptr/shared_ptr manage memory automatically.'],
      ['vector<T>', 'Dynamic, auto-growing array. push_back, size, [].'], ['Range-based for', 'for (int n : v) iterates values.'], ['class', 'Blueprint bundling data and methods.'], ['public / private', 'Interface vs hidden internal state (encapsulation).'], ['Constructor', 'Initializes a new object; named like the class.'], ['Destructor ~Class()', 'Cleans up when the object is destroyed.'], ['const ref param', 'const string& avoids copying and forbids modification.']
    ],
    qs: [
      P('int x = 5;\nint* p = &x;\n*p = 10;\ncout << x;', '10', ['5', '&x', 'error'], '*p = 10 changes x through the pointer.', 'C++'),
      Q('What does & mean in int* p = &x;?', 'The address of x', ['The value of x', 'A reference declaration here', 'Bitwise and'], '& = address-of.', 0),
      Q('What does * do in cout << *p;?', 'Dereferences — gives the value p points to', ['Multiplies', 'Declares a pointer', 'Takes the address'], '* = value at.', 0),
      Q('A memory leak is:', 'Heap memory allocated with new that is never freed', ['A null pointer', 'An integer overflow', 'A slow loop'], 'Un-freed heap memory.', 0),
      Q('Which container is a dynamic, auto-growing array?', 'vector', ['int[]', 'string', 'pointer'], 'vector.', 0),
      P('vector<int> v = {1, 2};\nv.push_back(3);\ncout << v.size();', '3', ['2', '1', '6'], 'Three elements now.', 'C++'),
      Q('private members of a class are:', 'Hidden from outside code (encapsulation)', ['Accessible everywhere', 'Automatically static', 'The constructor'], 'private = hidden.', 0),
      Q('A reference (int& r = x) is:', 'Another name (alias) for x', ['A copy of x', 'A pointer to x you dereference', 'The address of x'], 'Alias.', 0),
      Q('Why pass a large object as const string& s?', 'To avoid copying it and prevent modification', ['To make it global', 'It is required syntax', 'To allocate on the heap'], 'Efficient, safe.', 0),
      Q('Modern C++ avoids manual new/delete by using:', 'Smart pointers and containers like vector', ['More raw pointers', 'Global variables', 'goto'], 'RAII / smart pointers.', 0),
      Q('A constructor is a special method that:', 'Initializes a new object of the class', ['Deletes an object', 'Is always private', 'Returns an int'], 'Runs on creation.', 0),
      P('int a = 3;\nint& b = a;\nb = 10;\ncout << a;', '10', ['3', '13', 'error'], 'b is an alias for a.', 'C++'),
      Q('A dangling pointer causes:', 'Undefined behavior / a crash (segfault)', ['A compile error always', 'A memory leak', 'Nothing'], 'Invalid access.', 0)
    ],
    labs: ['cp-vector']
  });

  // ---------- labs (compile online via Compiler Explorer) ----------
  function clab(o) { o.kind = 'code'; o.lang = 'cpp'; L[o.id] = o; }
  clab({ id: 'cp-hello', title: 'Hello, C++', brief: 'Complete the program so it prints exactly:<br><code>Hello, C++!</code><br>(then a newline). This confirms the online compiler works.',
    starter: '#include <iostream>\nusing namespace std;\n\nint main() {\n    // print Hello, C++!\n    return 0;\n}\n',
    tests: [{ name: 'Prints Hello, C++!', expect: 'Hello, C++!' }],
    hints: ['<code>cout &lt;&lt; "Hello, C++!" &lt;&lt; endl;</code>', 'The text must match exactly, including the comma and exclamation mark.'],
    solution: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, C++!" << endl;\n    return 0;\n}',

  clab({ id: 'cp-sum', title: 'Sum two numbers', brief: 'Read two integers from input (on one line, separated by a space) and print their sum.', stdin: '12 30',
    starter: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b;\n    // read a and b, print a + b\n    return 0;\n}\n',
    tests: [{ name: '12 + 30 = 42', stdin: '12 30', expect: '42' }, { name: '-5 + 5 = 0', stdin: '-5 5', expect: '0' }],
    hints: ['<code>cin &gt;&gt; a &gt;&gt; b;</code> reads both.', '<code>cout &lt;&lt; a + b &lt;&lt; endl;</code>'],

  clab({ id: 'cp-vector', title: 'Sum and max of a vector', brief: 'Read an integer <code>n</code>, then <code>n</code> more integers. Store them in a <code>vector&lt;int&gt;</code>. Print the sum on one line and the maximum on the next.', stdin: '5\n4 8 15 16 23',
    starter: '#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<int> v;\n    // read n numbers into v, then print sum and max\n    return 0;\n}\n',
    tests: [{ name: '5 numbers → sum 66, max 23', stdin: '5\n4 8 15 16 23', expect: '66\n23' }, { name: '3 numbers', stdin: '3\n10 50 20', expect: '80\n50' }],
    hints: ['Loop n times: <code>int x; cin &gt;&gt; x; v.push_back(x);</code>', 'Track a running <code>sum</code> and a <code>best</code> (start best at the first value or a very small number).', 'Range-based: <code>for (int x : v) { sum += x; if (x &gt; best) best = x; }</code>'],
    solution: '#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<int> v;\n    for (int i = 0; i < n; i++) { int x; cin >> x; v.push_back(x); }\n    int sum = 0, best = v[0];\n    for (int x : v) { sum += x; if (x > best) best = x; }\n    cout << sum << endl << best << endl;\n    return 0;\n}',

/* AI Prompting track */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'ai1', track: 'ai', tier: 'ai-f', title: 'Prompting that gets elite results', code: 'role + task + context + format',
    goal: 'Structure, context, examples, iteration and verification — how to get professional output from any AI model.',
    lesson: [
      { h: 'A model is a brilliant intern with amnesia', html: '<p>It knows an enormous amount but <b>only what you put in the prompt right now</b>. It cannot read your mind, your files (unless you paste them), or remember last week. Vague in → vague out. Specific, structured in → excellent out.</p>' },
      { h: 'The anatomy of a strong prompt', html: '<ol><li><b>Role</b> — "You are a senior network engineer." Sets the voice and depth.</li><li><b>Task</b> — one clear instruction. "Review this firewall config for security issues."</li><li><b>Context</b> — the facts it needs: the config, the constraints, the audience.</li><li><b>Format</b> — exactly how to answer. "Return a table: issue, severity, fix." or "Answer in 3 bullet points."</li><li><b>Constraints</b> — length, tone, what to avoid. "Under 200 words. No marketing language."</li></ol><pre>You are a senior Python developer.          ← role\nReview the function below for bugs.          ← task\n[paste the code]                             ← context\nReturn: a numbered list of issues, each       ← format\nwith the line number and a one-line fix.\nBe concise; skip style nitpicks.             ← constraints</pre>' },
      { h: 'Techniques that multiply quality', html: '<ul><li><b>Give examples</b> (few-shot): show 1–2 input→output pairs and the model matches the pattern.</li><li><b>Ask for reasoning</b> on hard problems: "Think step by step before answering." It improves correctness on logic/math.</li><li><b>Set the output shape</b>: ask for JSON, a table, or a template when you\'ll use the result programmatically.</li><li><b>Decompose</b>: break a big task into steps and do them in sequence rather than one giant ask.</li><li><b>Give it an out</b>: "If you are unsure or missing information, say so and ask." This cuts confident-but-wrong answers.</li></ul>' },
      { h: 'Iterate and verify', html: '<p>The first answer is a draft. Refine: "Good, but make it shorter and add error handling." You are steering, not one-shotting.</p><div class="callout trap"><b class="k">Always verify</b>Models <b>hallucinate</b> — they can state wrong facts, fake citations, or buggy code with total confidence. <b>Run the code. Check the facts. Test the output.</b> Never ship an AI answer you haven\'t verified, especially in security, legal, or production work. The AI is a force multiplier, not an authority.</div>' },
      { h: 'What not to do', html: '<ul><li>Don\'t paste secrets, passwords, API keys, or customer data into a model you don\'t control.</li><li>Don\'t ask vague one-liners for complex work ("make it better").</li><li>Don\'t trust a cited source without opening it — citations can be invented.</li><li>Don\'t assume it remembers earlier chats unless that context is present.</li></ul>' }
    ],
    cards: [
      ['Context window', 'The prompt is all the model knows right now; it has no hidden memory.'], ['Role', 'Tell the model who to be: "You are a senior SRE."'], ['Task', 'One clear instruction.'], ['Context', 'The facts/data the model needs to do the task.'], ['Format', 'Specify exactly how to answer (table, JSON, bullets).'], ['Constraints', 'Length, tone, what to avoid.'],
      ['Few-shot', 'Give example input→output pairs to set the pattern.'], ['Step by step', 'Asking for reasoning improves hard logic/math answers.'], ['Decompose', 'Break a big task into ordered steps.'], ['Give it an out', 'Tell it to say "I don\'t know" or ask when unsure.'], ['Iterate', 'Refine the draft with follow-up instructions.'],
      ['Hallucination', 'Confident but false output — facts, citations, or code.'], ['Verify', 'Always run the code / check the facts before trusting output.'], ['Don\'t paste secrets', 'Never send passwords, keys, or private data to an untrusted model.'], ['AI is a tool', 'A force multiplier, not an authority.']
    ],
    qs: [
      Q('Why does a vague prompt give a vague answer?', 'The model only works with what you put in the prompt — no hidden context', ['The model is lazy', 'It needs payment', 'Vague prompts are blocked'], 'Garbage in, garbage out.', 0),
      Q('Which element sets the model\'s voice and depth?', 'Role ("You are a senior engineer")', ['Format', 'Length limit', 'Temperature'], 'Role.', 0),
      Q('To get output you\'ll parse programmatically, you should:', 'Specify the exact format (e.g. "return JSON with keys x, y")', ['Ask nicely', 'Use more adjectives', 'Ask twice'], 'Pin the format.', 0),
      Q('Few-shot prompting means:', 'Giving a couple of example input→output pairs', ['Prompting very briefly', 'Using few words', 'Asking few questions'], 'Examples set the pattern.', 0),
      Q('The single most important habit with AI output is:', 'Verify it — run the code, check the facts', ['Trust it fully', 'Always ask for more', 'Never iterate'], 'Verification.', 0),
      Q('A "hallucination" is when the model:', 'States something false with confidence', ['Crashes', 'Refuses to answer', 'Repeats itself'], 'Confident and wrong.', 0),
      Q('For a hard logic or math problem, it helps to:', 'Ask the model to reason step by step', ['Demand a one-word answer', 'Lower the detail', 'Ask faster'], 'Step-by-step reasoning.', 0),
      Q('Which should you NEVER paste into an untrusted model?', 'Passwords, API keys, or customer data', ['Example code', 'A public article', 'Your question'], 'Protect secrets.', 0),
      Q('The model gives a decent but too-long answer. Best move?', 'Iterate: "Make it shorter and add error handling"', ['Start a brand new chat', 'Accept it as-is', 'Ask the same thing again'], 'Refine the draft.', 0),
      Q('"If you are unsure, say so and ask" is useful because it:', 'Reduces confident-but-wrong answers', ['Makes replies longer', 'Disables the model', 'Is required syntax'], 'Cuts hallucinations.', 0),
      Q('Why decompose a big task into steps?', 'Each focused step produces better, checkable output than one giant ask', ['It uses fewer tokens always', 'The model prefers it', 'It is mandatory'], 'Focused steps win.', 0),
      Q('A cited source in an AI answer should be:', 'Opened and checked — citations can be invented', ['Trusted automatically', 'Ignored', 'Copied without reading'], 'Verify citations.', 0)
    ],
    labs: ['ai-structure', 'ai-debug']
  });

  // ---------- prompt rubric labs ----------

  function reqChips(s) {

  function pLearn(p, s) {

  // ---------- flashcards (Leitner) ----------
  var BOX_DAYS = [0, 1, 2, 4, 8, 16, 30];
  function cardState(c) { return S.cards[c.id] || { box: 0, due: 0 }; }
  function dueCards(list) { var now = Date.now(); return list.filter(function (c) { return cardState(c).due <= now; }); }
  function cardSession(p, list, label) {
    var mode = 'term', deck = shuffle(dueCards(list)), extra = false;

    function draw() {
      if (i >= deck.length) {

      p.innerHTML = '<div class="row small muted"><span>' + esc(label) + ' · ' + (i + 1) + '/' + deck.length + (extra ? ' (extra practice — nothing due)' : '') + '</span><span class="grow"></span>' +
        '<button class="btn sm ghost" id="swap">' + (mode === 'term' ? 'Term → Def' : 'Def → Term') + '</button></div>' +
        '<div class="flash' + (flipped ? ' flip' : '') + '" id="fc"><div class="in"><div class="f">' + front + '<div class="dim small" style="margin-top:12px">tap to flip · box ' + cs.box + '</div></div><div class="b">' + back + '</div></div></div>' +
        '<div class="grade"><button class="btn warn" data-g="0">Again</button><button class="btn" data-g="1">Hard</button><button class="btn pri" data-g="2">Got it</button></div>' +
        '<p class="dim small center" style="margin-top:10px">Laptop: Space flips · 1/2/3 grade</p>';
      $('#fc', p).onclick = function () { flipped = !flipped; this.classList.toggle('flip', flipped); };
      $('#swap', p).onclick = function () { mode = mode === 'term' ? 'def' : 'term'; flipped = false; draw(); };
      p.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { grade(+b.dataset.g); }; });
    }
    function grade(g) {
      var c = deck[i], cs = cardState(c);
      cs.box = g === 0 ? 0 : g === 1 ? Math.max(1, cs.box) : Math.min(6, cs.box + 1);
      cs.due = g === 0 ? Date.now() : Date.now() + BOX_DAYS[cs.box] * 864e5;
      S.cards[c.id] = cs; persist();
      if (g === 0) deck.push(c);
      i++; done++; flipped = false; draw();
    }
    function key(e) {
      if (!p.isConnected) { document.removeEventListener('keydown', key); return; }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    cleanup = function () { document.removeEventListener('keydown', key); };
    draw();
  }
  function pCards(p, s) { cardSession(p, s.cards, s.title); }

  // ---------- questions ----------
  function letter(i) { return 'ABCDEFG'.charAt(i); }

  }
  function renderQ(q, opts) { // returns html

  function pPractice(p, s) {
    var pool = s.qs, missedOnly = false;

        '<button class="btn sm ' + (missedOnly ? 'pri' : 'ghost') + '" id="mo">Missed only</button></div><div class="panel" id="qp">' + renderQ(q) + '</div>';
      $('#mo', p).onclick = function () { missedOnly = !missedOnly; next(); };

  // wire answering for a rendered question. instant=true shows explanation.
  function wire(box, q, done, instant) {

        var ci = +b.dataset.c; if (ci === q.a) b.classList.add('right'); else if (ci === picked) b.classList.add('wrong'); b.disabled = true;

      inp.onkeydown = function (e) { if (e.key === 'Enter') sub.click(); };

  }

  // ---------- gate test ----------
  function pGate(p, s) {
    var x = st(s.id);
    if (!gateReady(s)) {
      p.innerHTML = '<div class="panel"><h2>🔒 Gate locked</h2><p>Before you can test out of this step:</p><ul>' +
        '<li>' + (x.lesson ? '✓' : '○') + ' Read the lesson and mark it complete</li>' +
        ((s.labs || []).length ? '<li>' + (labsDone(s) === s.labs.length ? '✓' : '○') + ' Complete every lab (' + labsDone(s) + '/' + s.labs.length + ')</li>' : '') +
        '</ul><p class="muted">Then score <b>over ' + PASS + '%</b> to unlock the next step and earn your checkpoint phrase.</p></div>';
      return;
    }
    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) {
        var inPool = s.capstone.pool ? s.capstone.pool.indexOf(o.id) >= 0 : (o.idx <= s.idx && o.tier !== 'pro' && o.track === s.track);
        if (inPool) o.qs.forEach(function (q) { if (q.d) pool.push(q); });
      });
      var W = s.capstone.weights || C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;

    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && (cap && cap.domains || C.domains) ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';

        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';

  function vLab(m, args) {

      setCleanup: function (f) { cleanup = f; }
    };
    kind.render(m, L, api);
  }

  // ---------- CARDS (global) ----------
  function vCards(m) {
    var open = STAGES.filter(unlocked), all = [];
    open.forEach(function (s) { all = all.concat(s.cards); });
    var due = dueCards(all).length;
    m.innerHTML = '<h1>Flashcards</h1><p class="muted">Spaced repetition across every unlocked step. ' + due + ' due now of ' + all.length + '.</p>' +
      '<div class="row" style="margin-bottom:12px"><button class="btn pri" id="all">Review all due</button></div><div class="list">' +
      open.map(function (s) { return '<button class="li" data-st="' + s.id + '"><span class="grow"><b>' + esc(stepLabel(s)) + '. ' + esc(s.title) + '</b><div class="s">' + dueCards(s.cards).length + ' due · ' + s.cards.length + ' cards</div></span><span class="muted">›</span></button>'; }).join('') + '</div><div id="pane"></div>';
    $('#all', m).onclick = function () { var p = document.createElement('div'); m.innerHTML = ''; m.appendChild(p); cardSession(p, all, 'All decks'); };
    m.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { location.hash = '#stage/' + b.dataset.st + '/cards'; }; });
  }

  // ---------- TOOLS ----------
  function vTools(m) {
    m.innerHTML = '<h1>Tools & drills</h1><p class="muted">Endless, randomly generated practice. Use them any time — they never run out.</p><div class="list">' +
      (C.tools || []).map(function (t) { return '<button class="li" data-go="#tool/' + t.id + '"><span class="grow"><b>' + esc(t.title) + '</b><div class="s">' + esc(t.desc) + '</div></span><span class="muted">›</span></button>'; }).join('') + '</div>';
  }
  function vTool(m, args) {
    var t = (C.tools || []).filter(function (x) { return x.id === args[0]; })[0];
    if (!t) return vTools(m);
    m.innerHTML = '<div class="row" style="margin-bottom:8px"><button class="btn sm ghost" data-go="#tools">← Tools</button></div><h1>' + esc(t.title) + '</h1><div id="tool"></div>';
    t.render($('#tool', m), { esc: esc, shuffle: shuffle, toast: toast, gens: C.gens, renderQ: renderQ, wire: wire, prep: prep, setCleanup: function (f) { cleanup = f; } });
  }

  // ---------- SAVE / CODES ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]+/g, ''); }
  function restoreTo(s) {
    STAGES.forEach(function (o) {
      if (o.track === s.track && o.tidx <= s.tidx) { var x = st(o.id); x.lesson = true; (o.labs || []).forEach(function (l) { x.labs[l] = true; }); if (!x.passed) { x.passed = true; x.best = Math.max(x.best || 0, PASS + 1); x.restored = true; } }
    });
    persist();
  }
  function vCodes(m) {
    var earned = STAGES.filter(function (s) { return st(s.id).passed; });
    var hist = S.history.slice(-8).reverse();
    m.innerHTML = '<h1>Save & restore</h1>' +
      '<div class="panel"><h3>Restore from a checkpoint phrase</h3><p class="muted small">Lost your progress or switched devices? Type the phrase from the last step you passed. Every step up to it unlocks.</p>' +
      '<div class="row"><input class="answer-in grow" id="rc" placeholder="e.g. ' + esc(C.codeExample || 'PHRASE-HERE') + '" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="rb">Restore</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Your checkpoint phrases</h3>' +
      (earned.length ? '<div class="list">' + earned.map(function (s) { return '<div class="li" style="cursor:default"><span class="chip ok">' + esc(stepLabel(s).replace('Step ', '')) + '</span><span class="grow"><b>' + esc(s.title) + '</b><div class="mono small" style="color:var(--acc);margin-top:2px">' + esc(s.code) + '</div></span><button class="btn sm" data-cp="' + esc(s.code) + '">Copy</button></div>'; }).join('') + '</div>' +
        '<p class="muted small" style="margin-top:10px">Only your latest phrase in each track matters — it restores everything before it in that track.</p>' : '<p class="muted">Pass your first gate test to earn a phrase.</p>') + '</div>' +
      '<div class="panel" style="margin-top:12px"><h3>Backup file</h3><p class="muted small">Exports everything — card schedules, missed questions, lab configs. Use it to move between iPhone and laptop with full detail.</p>' +
      '<div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Device mode</h3><p class="muted small">Currently: <b>' + (S.device === 'phone' ? 'Phone (lite)' : 'Laptop (full)') + '</b></p><button class="btn" id="dev">Switch device mode</button></div>' +
      (hist.length ? '<div class="panel" style="margin-top:12px"><h3>Recent tests</h3>' + hist.map(function (h) { var s = stageById(h.stage); return '<div class="row small" style="margin:4px 0"><span class="grow">' + esc(s ? s.title : h.stage) + '</span><span class="mono" style="color:' + (h.pct > PASS ? 'var(--ok)' : 'var(--bad)') + '">' + h.pct + '%</span><span class="dim">' + new Date(h.at).toLocaleDateString() + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="panel" style="margin-top:12px"><h3>Danger zone</h3><button class="btn warn" id="rs">Reset all progress</button></div>';
    $('#rb', m).onclick = function () {
      var v = normCode($('#rc', m).value);
      var s = STAGES.filter(function (x) { return normCode(x.code) === v; })[0];
      if (!s) { toast('That phrase does not match any step. Check spelling.'); return; }
      restoreTo(s); S.track = s.track; toast('✓ Restored through ' + esc(stepLabel(s)) + ': ' + esc(s.title), 3000); route();
    };
    m.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copy(b.dataset.cp); }; });
    $('#ex', m).onclick = function () {
      var labs = {}; try { for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key.indexOf(C.id + ':lab:') === 0) labs[key] = localStorage.getItem(key); } } catch (e) { }
      var blob = new Blob([JSON.stringify({ course: C.id, at: Date.now(), state: S, labs: labs })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#im', m).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (d.course !== C.id) { toast('That backup belongs to a different course (' + esc(d.course) + ')'); return; }
          var dev = S.device; S = d.state; S.device = dev; persist();
          Object.keys(d.labs || {}).forEach(function (k) { try { localStorage.setItem(k, d.labs[k]); } catch (e) { } });
          toast('✓ Backup imported'); route();
        } catch (err) { toast('Could not read that file'); }
      };
      r.readAsText(f);
    };
    $('#dev', m).onclick = function () { picker(true); };
    $('#rs', m).onclick = function () {
      if (prompt('Type RESET to wipe all progress on this device') === 'RESET') {
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(C.id + ':') === 0) localStorage.removeItem(k); }); } catch (e) { }
        var dev = S.device; S = { device: dev, stages: {}, cards: {}, missed: {}, history: [], created: Date.now() }; persist(); route();
      }
    };
  }

  // expose for lab plugins / debugging
  window.ENGINE_Q = { prep: prep, renderQ: renderQ, wire: wire };
  window.ENGINE = { state: function () { return S; }, persist: persist, stages: STAGES, st: st, route: route, esc: esc };

  // ---------- boot ----------
  shell();
  if (!S.device) picker(false); else route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();

</script>
</body>
</html>
